<style>
:root{--bg:#F2F3F4;--line:#D0D4D8;--ink:#14171A;--dim:#575E65;--err:#B3261E}
@media (prefers-color-scheme: dark){:root{--bg:#121416;--line:#2A2F33;--ink:#E6E8EA;--dim:#8A9097;--err:#F2B8B5}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:grid;place-items:center;padding:16px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
form{width:100%;max-width:320px;display:grid;gap:14px}
h1{margin:0 0 10px;font-weight:300;font-size:40px;letter-spacing:-0.02em}
label{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row:focus-within{border-color:var(--ink)}
input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:16px "JetBrains Mono",ui-monospace,monospace;padding:12px 14px;outline:none}
button{border:0;border-left:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-size:15px;padding:0 18px;cursor:pointer}
button:hover{background:var(--line)}
#msg{min-height:1.2em;margin:0;font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--err)}
</style>
</head>

<form id="f" autocomplete="off" hidden>
  <h1>Driftfield</h1>
  <label for="pw">Password</label>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" required><button type="submit">Enter</button></div>
  <p id="msg" role="alert"></p>
</form>

  var KEY = "driftfield-key";
  var u8 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var f = document.getElementById("f"), pw = document.getElementById("pw"), msg = document.getElementById("msg");
  function store(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} }
  function read(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  async function open(rawKey){
    var key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:u8(D.iv) }, key, u8(D.ct));
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }
  async function derive(pass){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", salt:u8(D.salt), iterations:D.it, hash:"SHA-256" }, base, 256));
  }
  f.addEventListener("submit", async function(e){
    e.preventDefault(); msg.textContent = "";
    try {
      var raw = await derive(pw.value);
      var b = ""; raw.forEach(function(x){ b += String.fromCharCode(x); });
      await open(raw);
      store(KEY, btoa(b));
    } catch(err){ msg.textContent = "Wrong password"; pw.select(); }
  });
  var saved = read(KEY);
  if (saved) { open(u8(saved)).catch(function(){ store(KEY, null); f.hidden = false; pw.focus(); }); }
  else { f.hidden = false; pw.focus(); }
})();
