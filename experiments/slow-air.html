<title>Slow Air</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas. Launch = title + chart-table map + flight panel. HUD floats at the screen edges. */
:root{
  --sky:#cfe1ea;
  --sky-deep:#a9c8d8;
  --ink:#122433;
  --ink-soft:#4a5e6e;
  --accent:#ff6a3d;
  --card:#f4f7f6;
  --hud:#ffffff;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --mono:'Chakra Petch',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--sky)}

/* Launch */
#launch{position:fixed;inset:0;overflow:auto;background:linear-gradient(180deg,var(--sky-deep) 0%,var(--sky) 55%,#e4ecee 100%);z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 18px)}
.launch-inner{max-width:1020px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;min-height:100%}
.brand{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-weight:800;font-size:clamp(44px,9vw,92px);letter-spacing:-0.045em;line-height:.9;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--accent)}
.seed{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.mapwrap{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 rgba(18,36,51,.25),0 18px 40px -18px rgba(18,36,51,.45);background:#7fb7cc;touch-action:none}
#map{width:100%;height:100%;display:block;image-rendering:auto;cursor:crosshair}
#marker{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none}
#marker::before{content:"";position:absolute;inset:0;border:2px solid var(--ink);border-radius:50%;background:rgba(255,255,255,.35)}
#marker::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--accent);border-radius:50%}
.grid-lines{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px);background-size:12.5% 12.5%}
.compass{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
.coords{position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);pointer-events:none;font-variant-numeric:tabular-nums}
#mapLoading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(18,36,51,.25)}
.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
.lbl{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.hint{font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--ink-soft);max-width:44ch}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.actions .primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-size:20px;font-weight:800;padding:14px 26px;letter-spacing:-.01em;flex-basis:100%}
.pad-status{color:var(--ink);font-weight:600}
.stamps-mini{font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
@media (max-width:760px){.launch-inner{grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}.actions .primary{flex-basis:100%}}

/* HUD */
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(8,14,22,.38) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;color:var(--hud);font-family:var(--mono);text-shadow:0 1px 3px rgba(10,20,30,.45)}
.hud-tl{position:absolute;left:calc(env(safe-area-inset-left,0px) + 16px);top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;gap:18px;align-items:flex-end}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.thr{width:6px;height:38px;background:rgba(255,255,255,.28);border-radius:3px;position:relative;overflow:hidden}
.thr i{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:3px}
.hud-tr{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:14px;align-items:center}
.tally{display:flex;gap:14px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.tally span{display:flex;align-items:center;gap:6px}
.ic{display:inline-block;width:12px;height:12px}
.ic.ring{border:2.5px solid #ffd24a;border-radius:50%;box-sizing:border-box}
.ic.bal{background:#ff5d5d;border-radius:50% 50% 50% 50%/45% 45% 55% 55%}
.ic.star{background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(18,36,51,.38);color:#fff;font-family:var(--mono);font-weight:600;font-size:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-8px);opacity:0;transition:opacity .4s,transform .4s;text-align:center;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,34px);letter-spacing:-.02em}
#toast span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
#keyhint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);font-size:12px;letter-spacing:.06em;opacity:.9;transition:opacity 1.2s;white-space:nowrap}

/* Touch controls */
#touchUI{position:absolute;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;top:70px;bottom:0;width:55%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(18,36,51,.16);pointer-events:none;opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.85)}
#stickHome{position:absolute;left:calc(env(safe-area-inset-left,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);pointer-events:none}
#fireBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:82px;height:82px;border-radius:50%;border:0;background:rgba(255,106,61,.8);color:#fff;font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.1em;pointer-events:auto;touch-action:none}
#fireBtn.on{background:rgba(255,106,61,1);transform:scale(.95)}
#thrTrack{position:absolute;right:calc(env(safe-area-inset-right,0px) + 120px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:46px;height:170px;border-radius:23px;background:rgba(18,36,51,.3);pointer-events:auto;touch-action:none;overflow:hidden}
#thrFill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.75)}
#thrTrack span{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:10px;letter-spacing:.1em;color:#fff}
#smokeBtn{position:absolute;right:calc(env(safe-area-inset-right,0px) + 32px);bottom:calc(env(safe-area-inset-bottom,0px) + 122px)}

/* Pause */
#pause{position:fixed;inset:0;z-index:15;background:rgba(18,36,51,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.card{max-width:620px;margin:0 auto;background:var(--card);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:20px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.card h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em}
.log{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stamp{border:1.5px dashed #b7c3ca;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-height:58px}
.stamp.got{border:1.5px solid var(--ink);background:#fff}
.stamp b{font-size:15px;font-weight:700;line-height:1.15}
.stamp small{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;position:relative;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--card) inset}
.sw:disabled{opacity:.22;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.card .actions .primary{flex-basis:auto}
#tune{position:fixed;z-index:12;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 64px);width:min(300px,calc(100vw - 32px));max-height:calc(100% - 150px);overflow:auto;background:rgba(244,247,246,.94);color:var(--ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:12px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);touch-action:pan-y}
#tune h3{margin:0;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
#tune h3 button{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 6px}
.tr-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.tr-row label{letter-spacing:.04em}
.tr-row output{font-variant-numeric:tabular-nums;font-weight:600}
.tr-row input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0;height:26px}
.tune-btns{display:flex;flex-wrap:wrap;gap:6px}
.tune-btns button{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:12px;font-weight:600}
#tuneOut{width:100%;box-sizing:border-box;height:62px;font-family:var(--mono);font-size:11px;border:1px solid #b7c3ca;border-radius:6px;padding:6px;resize:none;background:#fff;color:var(--ink)}
#tuneBtn{pointer-events:auto}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){#toast,#fade{transition:none}}
</style>

<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <div class="stat"><b id="alt">0</b><span>m alt</span></div>
    <div class="stat"><b id="spd">0</b><span>km/h</span></div>
    <div class="thr" aria-hidden="true"><i id="thrBar"></i></div>
  </div>
  <div class="hud-tr">
    <div class="tally">
      <span><i class="ic ring"></i><b id="tRings">0</b></span>
      <span><i class="ic bal"></i><b id="tBal">0</b></span>
      <span><i class="ic star"></i><b id="tFind">0</b></span>
    </div>
    <button class="round" id="tuneBtn" aria-label="Tuning panel" hidden>DEV</button>
    <button class="round" id="pauseBtn" aria-label="Pause">II</button>
  </div>
  <div id="toast"><span id="toastSub"></span><b id="toastMain"></b></div>
  <div id="keyhint"></div>
  <div id="touchUI" hidden>
    <div id="stickZone"></div>
    <div id="stickHome"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="thrTrack"><div id="thrFill"></div><span>THR</span></div>
    <button id="fireBtn">FIRE</button>
    <button class="round" id="smokeBtn" aria-label="Toggle smoke">~</button>
  </div>
</div>

<div id="pause" hidden>
  <div class="card">
    <h2>Logbook</h2>
    <div class="log" id="logGrid"></div>
    <div><span class="lbl">Paint</span><div class="swatches" id="paintSw"></div></div>
    <div><span class="lbl">Smoke</span><div class="swatches" id="trailSw"></div></div>
    <div class="row">
      <button class="toggle" id="invTog">Inverted pitch</button>
      <button class="toggle" id="qualTog">High detail</button>
      <button class="toggle" id="sndTog">Sound</button>
      <button class="toggle" id="camTog">Cockpit view</button>
    </div>
    <div class="actions">
      <button class="primary" id="resume">Keep flying</button>
      <button id="toMap">New takeoff spot</button>
      <button id="devOpen">Tuning panel</button>
    </div>
  </div>
</div>

<div id="tune" hidden>
  <h3>Tuning <button id="tuneClose" aria-label="Close tuning panel">×</button></h3>
  <div id="tuneRows" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="tune-btns">
    <button id="spawnRings">Rings ahead</button>
    <button id="spawnBal">Balloons ahead</button>
  </div>
  <div class="tune-btns">
    <button id="tuneCopy">Copy values</button>
    <button id="tuneReset">Reset</button>
  </div>
  <textarea id="tuneOut" readonly aria-label="Current tuning values"></textarea>
</div>
<div id="fade"></div>

<div id="launch">
  <div class="launch-inner">
    <header class="brand"><h1>Slow <em>Air</em></h1><span class="seed" id="seedLabel"></span></header>
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" width="240" height="240" aria-label="World map. Tap to choose a takeoff spot."></canvas>
      <div class="grid-lines"></div>
      <div class="compass">N ↑</div>
      <div class="coords" id="coords"></div>
      <div id="marker"></div>
      <div id="mapLoading">Charting</div>
    </div>
    <div class="panel">
      <div><span class="lbl">Controls</span>
        <div class="chips" id="chips">
          <button data-mode="touch">Touch</button>
          <button data-mode="keys">Keyboard</button>
          <button data-mode="pad">Gamepad</button>
        </div>
      </div>
      <div class="hint" id="ctrlHint"></div>
      <div class="hint pad-status" id="padStatus" hidden></div>
      <div class="hint pad-status" id="vrNote" hidden></div>
      <div class="stamps-mini" id="launchTally"></div>
      <div class="actions">
        <button class="primary" id="go">Take off</button>
        <button id="rand">Random spot</button>
        <button id="newWorld">New world</button>
        <button id="vrGo" hidden>Fly in VR</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
{const _sh=THREE.Color.prototype.setHex;THREE.Color.prototype.setHex=function(h){_sh.call(this,h);return this.convertSRGBToLinear()}}
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, mix=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)};

/* ---------- save ---------- */
const store={get(){try{return JSON.parse(localStorage.getItem('slowair.v1')||'null')}catch(e){return null}},set(v){try{localStorage.setItem('slowair.v1',JSON.stringify(v))}catch(e){}}};
const save=Object.assign({seed:0,found:{},courses:[],clusters:[],popped:0,paint:0,trail:0,paintsOpen:1,trailsOpen:1,invert:false,sound:true,mode:null,cockpit:false},store.get()||{});
if(!save.v2){save.invert=true;save.v2=true}
let SEED=save.seed||((Math.random()*8999|0)+1000); save.seed=SEED;
const persist=()=>store.set(save);
const TUNE_DEFS=[
  ['ringSize','Ring size',.8,4,.05,1.8],
  ['ringGap','Ring spacing (m)',40,300,5,95],
  ['balloonSize','Balloon size',.8,4,.05,2],
  ['hitAssist','Hit assist (m)',0,15,.5,4],
  ['fireRate','Fire rate (/s)',4,20,1,11],
  ['pitchRate','Pitch rate',.3,2,.05,.8],
  ['rollRate','Roll rate',.4,3,.05,1.35],
  ['turnRate','Turn from bank',.3,2,.05,.9],
  ['smoothing','Stick response',.6,8,.1,2.2],
  ['expo','Stick curve',1,3,.05,1.8],
  ['autoLevel','Auto level',0,1.5,.05,.6],
  ['topSpeed','Top speed (m/s)',70,220,5,130],
  ['cloudOpacity','Cloud opacity',.1,1,.05,.5],
];
const TUNE=Object.fromEntries(TUNE_DEFS.map(d=>[d[0],d[5]]));
Object.assign(TUNE,save.tune||{});
const coursesDone=new Set(save.courses), clustersDone=new Set(save.clusters);
const isFound=(t,k)=>(save.found[t]||[]).includes(k);
const foundCount=()=>Object.values(save.found).reduce((a,v)=>a+v.length,0);

/* ---------- noise ---------- */
function hash(ix,iz,s){let h=Math.imul(ix|0,374761393)^Math.imul(iz|0,668265263)^Math.imul((s+SEED)|0,982451653);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,z,s){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;const ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);const a=hash(ix,iz,s),b=hash(ix+1,iz,s),c=hash(ix,iz+1,s),d=hash(ix+1,iz+1,s);return (a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz)*2-1}
function fbm(x,z,o,s){let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=a*vnoise(x*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03}return v/n}
function ridged(x,z,o,s){let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){const r=1-Math.abs(vnoise(x*f,z*f,s+i*31));v+=a*r*r;n+=a;a*=.5;f*=2.1}return v/n}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- world field ---------- */
function field(x,z){
  const cont=fbm(x*.00016,z*.00016,4,1)*1.7;
  const land=sm(-.12,.06,cont);
  const mk=sm(.05,.42,fbm(x*.0003,z*.0003,3,50)*1.7)*land;
  const dryN=fbm(x*.00025,z*.00025,3,90)*1.7;
  const cityN=fbm(x*.00045,z*.00045,2,130)*1.7;
  const hills=fbm(x*.0032,z*.0032,3,7);
  let h=cont*190+16+hills*(12+38*land);
  if(mk>0){const r=ridged(x*.001,z*.001,4,200);h+=mk*r*r*920}
  const dk=sm(.12,.38,dryN)*(1-mk)*land;
  if(dk>0){
    const m=fbm(x*.0022,z*.0022,3,300)*1.7;
    const step=Math.floor(sm(-.6,.8,m)*5)/5;
    const cut=Math.abs(fbm(x*.0016,z*.0016,2,333));
    const canyon=sm(.07,0,cut);
    h=mix(h,mix(40+step*180,6,canyon),dk);
  }
  const ck=sm(.26,.4,cityN)*(1-mk)*(1-dk)*sm(.12,.32,cont);
  if(ck>0)h=mix(h,12+hills*3,ck);
  return {h,mk,dk,ck,cityN,cont};
}
function atmoAt(x,z){
  return {

function updateRings(t){

    for(const r of c.rings){

      r.m.material.color.setHex(0xffc83d);r.m.material.emissive.setHex(0xffa41c);r.m.material.emissiveIntensity=1+Math.sin(t*4)*.3;r.m.material.opacity=1;r.m.scale.setScalar(TUNE.ringSize*pulse);

function placeMarker(){const m=$('marker');m.style.left=((sel.x/EXT/2+.5)*100)+'%';m.style.top=((sel.z/EXT/2+.5)*100)+'%';
  const km=v=>(Math.abs(v)/1000).toFixed(1);$('coords').textContent=`${sel.z<=0?'N':'S'} ${km(sel.z)} km  ${sel.x>=0?'E':'W'} ${km(sel.x)} km`}
function renderMap(){
  const tok=++mapTok;const cv=$('map'),ctx=cv.getContext('2d');const img=ctx.createImageData(MS,MS);const prev=new Float32Array(MS);const c=new THREE.Color();
  $('mapLoading').hidden=false;$('seedLabel').textContent='World '+SEED;let row=0;

    if(tok!==mapTok)return;

    for(;row<end;row++){let left=0;for(let i=0;i<MS;i++){
      const wx=(i/MS-.5)*2*EXT,wz=(row/MS-.5)*2*EXT,f=field(wx,wz);
      if(f.h<0)c.copy(COL.deep).lerp(COL.shallow,sm(-170,0,f.h));
      else{faceColor(c,f.h,f.mk>.3&&f.h>300?.6:.9,f.ck,f.dk,f.mk,.5);const sh=clamp(1+((f.h-(i?left:f.h))+(f.h-(row?prev[i]:f.h)))*.012,.72,1.25);c.multiplyScalar(sh)}

      c.convertLinearToSRGB();left=f.h;prev[i]=f.h;const o=(row*MS+i)*4;img.data[o]=clamp(c.r*255,0,255);img.data[o+1]=clamp(c.g*255,0,255);img.data[o+2]=clamp(c.b*255,0,255);img.data[o+3]=255}}

function pickSpot(rand){

  sel={x:0,z:0};placeMarker();
}
$('map').addEventListener('pointerdown',e=>{const r=$('map').getBoundingClientRect();sel={x:((e.clientX-r.left)/r.width-.5)*2*EXT,z:((e.clientY-r.top)/r.height-.5)*2*EXT};placeMarker()});
$('rand').onclick=()=>pickSpot(true);
$('newWorld').onclick=()=>{SEED=(Math.random()*8999|0)+1000;save.seed=SEED;persist();fcache.clear();clearWorld();renderMap();pickSpot(false)};
$('go').onclick=startFlight;

let worldSeed=null;

  const at=atmoAt(P.pos.x,P.pos.z);A.storm=at.storm;A.warm=at.warm;A.mist=at.mist;A.cloud=0;A.rain=0;

/* ---------- VR (WebXR, Quest) ---------- */

// floating HUD panel just below your line of sight
const vrHudCanvas=document.createElement('canvas');vrHudCanvas.width=512;vrHudCanvas.height=200;
const vrHudCtx=vrHudCanvas.getContext('2d');const vrHudTex=new THREE.CanvasTexture(vrHudCanvas);vrHudTex.encoding=THREE.sRGBEncoding;
const vrHud=new THREE.Mesh(new THREE.PlaneGeometry(.56,.22),new THREE.MeshBasicMaterial({map:vrHudTex,transparent:true,depthTest:false,depthWrite:false,toneMapped:false,fog:false}));
vrHud.position.set(0,-.36,-.95);vrHud.rotation.x=-.38;vrHud.renderOrder=999;vrHud.visible=false;rig.add(vrHud);
/* VR hands-on controls: squeeze the right grip to hold a flight stick, the left grip to hold the throttle lever */

  g.addEventListener('connected',e=>{g.userData.hand=e.data&&e.data.handedness});g.addEventListener('disconnected',()=>{g.userData.hand=null});rig.add(g);return g});
const gripOf=h=>xrGrips.find(g=>g.userData.hand===h);
const STICK_TILT=.42,STICK_DEAD=.05,STICK_LEN=.24,LEVER_RANGE=.16,TWIST_RANGE=.55,TWIST_DEAD=.1;
const vrMat=new THREE.MeshStandardMaterial({color:0x1d2a35,roughness:.6,metalness:.2});
const vrKnobMat=new THREE.MeshStandardMaterial({color:0xff6a3d,roughness:.5});
function makeHandle(len){const g=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.011,.014,len,12),vrMat);shaft.position.y=len/2;
  const knob=new THREE.Mesh(new THREE.SphereGeometry(.026,16,12),vrKnobMat);knob.position.y=len;
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.018,20),vrMat);
  g.add(shaft,knob,base);g.visible=false;rig.add(g);return g}
const vrStickMesh=makeHandle(STICK_LEN),vrLeverMesh=makeHandle(.16);
const vrStick={held:false,p0:new THREE.Vector3(),q0inv:new THREE.Quaternion(),yawInv:new THREE.Quaternion()};
const vrLever={held:false,z0:0,t0:0,yawInv:new THREE.Quaternion(),lastStep:0};
const hv1=new THREE.Vector3(),hv2=new THREE.Vector3(),hq=new THREE.Quaternion();
function buzzHand(src,v,ms){const h=src.gamepad&&src.gamepad.hapticActuators&&src.gamepad.hapticActuators[0];if(h&&h.pulse)try{h.pulse(v,ms)}catch(e){}}
function headYawInv(out){const f=hv2.set(0,0,-1).applyQuaternion(camera.quaternion);return out.setFromAxisAngle(AY,Math.atan2(-f.x,-f.z)).invert()}
function ctlYaw(g){const f=hv2.set(0,0,-1).applyQuaternion(g.quaternion);return Math.atan2(-f.x,-f.z)}
function localDelta(g,p0,yawInv){return hv1.copy(g.position).sub(p0).applyQuaternion(yawInv)}
const sdz=(v,d)=>Math.abs(v)<d?0:(v-Math.sign(v)*d);
function stickHold(src,g,grabbed,acc){
  if(grabbed){vrStick.held=true;vrStick.p0.copy(g.position);vrStick.q0inv.copy(g.quaternion).invert();headYawInv(vrStick.yawInv);buzzHand(src,.4,40)}
  /* rotation since the grab, as an axis-angle vector in the grab-time facing frame */
  hq.copy(g.quaternion).multiply(vrStick.q0inv);if(hq.w<0){hq.x=-hq.x;hq.y=-hq.y;hq.z=-hq.z;hq.w=-hq.w}
  const ang=2*Math.acos(clamp(hq.w,-1,1)),sn=Math.sqrt(Math.max(1-hq.w*hq.w,1e-9));
  const rv=hv1.set(hq.x/sn*ang,hq.y/sn*ang,hq.z/sn*ang).applyQuaternion(vrStick.yawInv);
  const sy=clamp(sdz(-rv.x,STICK_DEAD)/(STICK_TILT-STICK_DEAD),-1,1);   /* tilt forward: push */
  const sx=clamp(sdz(-rv.z,STICK_DEAD)/(STICK_TILT-STICK_DEAD),-1,1);   /* tilt right: roll right */
  const tw=sdz(-rv.y,TWIST_DEAD)/(TWIST_RANGE-TWIST_DEAD);               /* twist right: rudder right */
  acc.roll+=sx;acc.pitch+=sy;acc.yaw+=clamp(tw,-1,1);
  /* draw the stick: base fixed under the grab point, leaning the way the wrist tilts */
  const m=vrStickMesh;m.visible=true;
  m.position.copy(vrStick.p0).y-=STICK_LEN;
  const lean=hv2.set(sx*.35,1,-sy*.35).applyQuaternion(hq.copy(vrStick.yawInv).invert()).normalize();
  m.quaternion.setFromUnitVectors(AY,lean);
}
function stickRelease(){vrStick.held=false;vrStickMesh.visible=false}
function leverHold(src,g,grabbed){
  if(grabbed){vrLever.held=true;headYawInv(vrLever.yawInv);vrLever.z0=hv1.copy(g.position).applyQuaternion(vrLever.yawInv).z;vrLever.t0=P.thr;vrLever.lastStep=Math.round(P.thr*10);buzzHand(src,.4,40);
    vrLeverMesh.position.copy(g.position).y-=.16}
  const z=hv1.copy(g.position).applyQuaternion(vrLever.yawInv).z;
  P.thr=clamp(vrLever.t0+(vrLever.z0-z)/LEVER_RANGE,0,1);
  const step=Math.round(P.thr*10);if(step!==vrLever.lastStep){vrLever.lastStep=step;buzzHand(src,step===0||step===10?.6:.15,step===0||step===10?50:12)}
  const m=vrLeverMesh;m.visible=true;
  const lean=hv1.set(0,.16,-(P.thr-.5)*LEVER_RANGE*1.2).applyQuaternion(hq.copy(vrLever.yawInv).invert()).normalize();

function leverRelease(){vrLever.held=false;vrLeverMesh.visible=false}
let vrMsg=null,vrHudT=0,vrHudKey='';
function drawVrHud(){
  const alt=Math.max(0,Math.round(P.pos.y)),spd=Math.round(P.speed*3.6),thr=Math.round(P.thr*100);
  const msg=vrMsg&&clock<vrMsg.t?vrMsg:null;const key=alt+'|'+spd+'|'+thr+'|'+(msg?msg.main:'');if(key===vrHudKey)return;vrHudKey=key;
  const x=vrHudCtx,W=512,H=200;x.clearRect(0,0,W,H);
  x.fillStyle='rgba(14,28,40,.55)';x.beginPath();x.roundRect?x.roundRect(6,110,W-12,84,22):x.rect(6,110,W-12,84);x.fill();
  x.fillStyle='#fff';x.textBaseline='middle';x.font='600 40px "Chakra Petch", monospace';
  x.textAlign='left';x.fillText(alt+' m',30,152);x.textAlign='center';x.fillText(spd+' km/h',W/2,152);
  x.fillStyle='rgba(255,255,255,.3)';x.fillRect(W-150,140,120,20);x.fillStyle='#fff';x.fillRect(W-150,140,120*P.thr,20);
  if(msg){x.textAlign='center';x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=10;
    x.font='800 52px "Bricolage Grotesque", sans-serif';x.fillText(msg.main,W/2,58);
    x.font='600 22px "Chakra Petch", monospace';x.fillText(msg.sub.toUpperCase(),W/2,12+8);x.shadowBlur=0}
  vrHudTex.needsUpdate=true;
}
function buzz(v,ms){if(!xrSession)return;for(const s of xrSession.inputSources){const h=s.gamepad&&s.gamepad.hapticActuators&&s.gamepad.hapticActuators[0];if(h&&h.pulse)try{h.pulse(v,ms)}catch(e){}}}
const xrPrev={left:[],right:[]};
function readXR(acc){
  if(!xrSession)return;
  const dz=v=>Math.abs(v)<.12?0:(v-Math.sign(v)*.12)/.88;
  for(const src of xrSession.inputSources){const gp=src.gamepad;if(!gp)continue;const hand=src.handedness;
    const sx=gp.axes[2]||0,sy=gp.axes[3]||0,b=i=>gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.5);
    const prev=xrPrev[hand]||[];const edge=i=>b(i)&&!prev[i];
    const g=gripOf(hand),grip=b(1)&&g&&g.visible;
    if(hand==='right'){if(grip)stickHold(src,g,!vrStick.held,acc);else if(vrStick.held)stickRelease();
      acc.roll+=dz(sx);acc.pitch+=-dz(sy);if(b(0))acc.fire=true;
      if(edge(4)&&state==='fly')toggleSmoke();if(edge(5))vrRecenterT=.01}
    else if(hand==='left'){if(grip)leverHold(src,g,!vrLever.held);else if(vrLever.held)leverRelease();
      acc.thrD+=-dz(sy)*1.3;acc.yaw+=dz(sx);
      if(edge(4)){vrView=vrView==='cockpit'?'chase':'cockpit';camPos.copy(P.pos);vrRecenterT=.01}
      if(edge(5))vrRecenterT=.01}
    xrPrev[hand]=gp.buttons.map(x=>x.pressed||x.value>.5)}
}
function updateVRCamera(dt){
  const fwd=v1.copy(AZ).applyQuaternion(P.q);
  if(vrView==='cockpit'&&state!=='crash'){
    plane.visible=true;pilotGroup.visible=false;if(scarfMesh)scarfMesh.visible=false;
    rig.quaternion.copy(P.q).multiply(qFlip);
    rig.position.copy(v2.set(0,1.18,-.62).applyQuaternion(P.q)).add(P.pos);
  }else{
    plane.visible=true;pilotGroup.visible=true;if(scarfMesh)scarfMesh.visible=true;
    qYaw.setFromAxisAngle(AY,Math.atan2(fwd.x,fwd.z));
    const want=v2.set(0,3.4,-13).applyQuaternion(qYaw).add(P.pos);camPos.lerp(want,1-Math.exp(-dt*4));
    const g=Math.max(groundAt(camPos.x,camPos.z),0)+2;if(camPos.y<g)camPos.y=g;
    rig.position.copy(camPos);rig.quaternion.copy(qYaw).multiply(qFlip);
  }
  if(vrRecenterT>0){vrRecenterT-=dt;if(vrRecenterT<=0){seatOff.copy(camera.position).negate()}}
  rig.position.add(v3.copy(seatOff).applyQuaternion(rig.quaternion));
  rig.updateMatrixWorld();camera.getWorldPosition(vrCam);
  sky.position.copy(vrCam);water.position.set(P.pos.x,0,P.pos.z);
  vrHudT-=dt;if(vrHudT<=0){vrHudT=.15;drawVrHud()}
}
let vrQualPrev=null;
function setQuality(name){save.quality=name;Q=QUAL[name];SEG=Q.seg;ST=CH/SEG;fcache.clear();
  sun.shadow.mapSize.set(Q.shadow,Q.shadow);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
  if(state!=='launch'){clearWorld();stream(true)}}
async function enterVR(){
  let session;
  try{session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']})}
  catch(e){$('vrNote').hidden=false;$('vrNote').textContent='VR could not start here. Open this page in the Quest browser from its own web address.';return}
  xrSession=session;renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  try{const bl=session.renderState.baseLayer;if(bl&&'fixedFoveation' in bl)bl.fixedFoveation=1}catch(e){}
  xrOn=true;vrView='cockpit';seatOff.set(0,0,0);vrRecenterT=.6;
  vrQualPrev=save.quality;if(save.quality==='high'){Q=QUAL.balanced;SEG=Q.seg;ST=CH/SEG;fcache.clear();sun.shadow.mapSize.set(1024,1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  startFlight();$('touchUI').hidden=true;$('hud').hidden=true;vrHud.visible=true;
  vrMsg={main:'Grab the stick',sub:'Right grip flies · left grip throttle',t:clock+6};
  renderer.setAnimationLoop(frame);
  session.addEventListener('end',()=>{
    xrOn=false;xrSession=null;renderer.setAnimationLoop(null);renderer.xr.enabled=false;vrHud.visible=false;stickRelease();leverRelease();

    if(state==='fly')togglePause();
  });
}
$('vrGo').onclick=()=>{enterVR()};
try{if(navigator.xr&&navigator.xr.isSessionSupported)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{$('vrGo').hidden=!ok}).catch(()=>{})}catch(e){}

/* ---------- loop ---------- */
function frame(now,xrFrame){
  if(xrOn&&!xrFrame)return;
  if(!xrOn)requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='launch'){return}
  if(state==='fly'||state==='crash'){
    clock+=dt;
    readInput(dt);
    if(state==='fly'){updatePlane(dt);fire(dt)}
    else{P.crashT-=dt;if(P.crashT<=0)respawn()}
    animatePlane(dt,clock);updateVapor();
    plane.position.copy(P.pos);plane.quaternion.copy(P.q);
    stream(false);
    SU.uTime.value=clock;cloudSortT-=dt;if(cloudSortT<=0){cloudSortT=.35;sortClouds()}
    updateAtmo(dt);updateBullets(dt);updateBalloons(clock);updateRings(clock);updateEggs(clock,dt);updateParts(dt);updateTrail(dt);
    updateCamera(dt);
    hudT-=dt;if(hudT<=0){hudT=.1;updateHud()}
  }else if(state==='pause'){readInput(0)}
  audioTick(dt);
  renderFrame();
}

renderMap();pickSpot(false);updateLaunchTally();syncToggles();if(save.dev)$('tuneBtn').hidden=false;
requestAnimationFrame(frame);
})();
