<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driftfield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEE;--ink:#14181E;--muted:#69717C;--line:rgba(20,26,34,.11);--wave:#3A4350;
  --glass:rgba(255,255,255,.46);--glass-hi:rgba(255,255,255,.88);--glass-edge:rgba(255,255,255,.75);--glass-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 12px 40px rgba(28,36,52,.07);
  --thumb:#FFFFFF;--thumb-edge:rgba(20,26,34,.18);
  --g1:rgba(240,168,136,.55);--g2:rgba(132,160,236,.55);--g3:rgba(142,208,184,.5);
  --v1:#2C8466;--v2:#A87420;--v3:#3B62B6;--v4:#B2486E;--rec:#D2402C;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E13;--ink:#ECEFF3;--muted:#8B94A1;--line:rgba(255,255,255,.09);--wave:#C9D1DC;
    --glass:rgba(255,255,255,.04);--glass-hi:rgba(255,255,255,.11);--glass-edge:rgba(255,255,255,.09);--glass-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 60px rgba(0,0,0,.35);
    --thumb:#F4F6F9;--thumb-edge:rgba(0,0,0,.4);
    --g1:rgba(130,90,180,.5);--g2:rgba(50,110,190,.46);--g3:rgba(50,150,130,.36);
    --v1:#86D4B6;--v2:#EBC88E;--v3:#9DB7F4;--v4:#EFA3BE;--rec:#FF6B57;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E13;--ink:#ECEFF3;--muted:#8B94A1;--line:rgba(255,255,255,.09);--wave:#C9D1DC;
  --glass:rgba(255,255,255,.04);--glass-hi:rgba(255,255,255,.11);--glass-edge:rgba(255,255,255,.09);--glass-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 60px rgba(0,0,0,.35);
  --thumb:#F4F6F9;--thumb-edge:rgba(0,0,0,.4);
  --g1:rgba(130,90,180,.5);--g2:rgba(50,110,190,.46);--g3:rgba(50,150,130,.36);
  --v1:#86D4B6;--v2:#EBC88E;--v3:#9DB7F4;--v4:#EFA3BE;--rec:#FF6B57;color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sans:"Instrument Sans",ui-sans-serif,-apple-system,system-ui,"Segoe UI",sans-serif;--serif:"Instrument Serif",ui-serif,Georgia,serif}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;position:relative;z-index:0;isolation:isolate;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(30% 26% at 26% 24%,var(--g1),transparent 72%),radial-gradient(34% 30% at 76% 32%,var(--g2),transparent 72%),radial-gradient(38% 30% at 42% 74%,var(--g3),transparent 72%);
  filter:blur(30px);animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
button,select,input{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.glass,.field,.deck,.take{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.app{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 2px 22px}
h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(38px,9vw,54px);letter-spacing:-0.015em;line-height:1}
.transport{display:flex;gap:10px;align-items:center;flex-shrink:0}
.round{width:52px;height:52px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--glass-shadow);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .12s}
.round:active{transform:scale(.96)}
.round:disabled{opacity:.3;cursor:default}
#play{background:var(--ink);color:var(--bg);border-color:transparent}
#play svg{width:18px;height:18px}
#rec .dot{width:12px;height:12px;border-radius:50%;background:var(--rec);transition:border-radius .15s}
#rec.on{border-color:color-mix(in srgb,var(--rec) 60%,transparent)}
#rec.on .dot{border-radius:2px}
.rectime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--rec);font-weight:500;letter-spacing:.02em;min-width:0}
.field{position:relative;border-radius:22px;overflow:hidden}
#wave{display:block;width:100%;height:264px;touch-action:none;cursor:grab}
@media (min-width:800px){#wave{height:330px}}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.empty p{margin:0}
.empty strong{display:block;font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:-0.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty .row{justify-content:center}
.btn{min-height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font-weight:500;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--glass-hi)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:transparent}
.toolbar{margin-top:14px;justify-content:space-between}
.sources{margin-top:14px;gap:6px 8px}
.sources .lbl{color:var(--muted);font-size:12.5px;margin-right:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.chipwrap{display:inline-flex;align-items:center;gap:0}
.del{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font-size:12px;font-weight:500;opacity:.7}
.del:hover{opacity:1;color:var(--ink)}
.del svg{width:9px;height:9px}
.del.armed{width:auto;padding:0 11px;border-radius:999px;background:var(--rec);color:#fff;opacity:1}
.take{margin-top:14px;border-radius:18px;padding:14px 16px;display:none;gap:12px;flex-direction:column}
.take.show{display:flex}
.take .name{font-weight:500}
.take audio{width:100%;height:36px}
.microw{display:flex;align-items:center;gap:16px}
.micinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.micrec{width:56px;height:56px;flex-shrink:0}
.micrec .dot{width:16px;height:16px;border-radius:50%;background:var(--rec);transition:border-radius .15s}
.micrec.on{border-color:color-mix(in srgb,var(--rec) 60%,transparent)}
.micrec.on .dot{border-radius:3px}
.srcgain{flex-basis:100%;max-width:420px;--c:var(--ink);margin-top:2px}
.lvl{height:2px;border-radius:1px;background:var(--line);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--v1);transition:width .06s linear}
.lvl i.hot{background:var(--rec)}
.pages{display:inline-grid;grid-auto-flow:column;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);margin:0 0 18px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.pages button{border:0;background:transparent;color:var(--muted);padding:7px 20px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.pages button[aria-selected="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
body[data-page="record"] #rec,body[data-page="record"] #recTime{display:none}
.recfield{display:flex;flex-direction:column}
#liveWave{display:block;width:100%;height:220px}
@media (min-width:800px){#liveWave{height:280px}}
.recbar{display:flex;align-items:center;gap:16px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.recinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.recstate{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:500}
.recstate .rectime{font-size:13px}
.meter2{position:relative;height:2px;background:var(--line);border-radius:1px}
.meter2 i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--v1);border-radius:1px}
.meter2 i.hot{background:var(--rec)}
.meter2 b{position:absolute;top:-3px;width:1px;height:8px;background:var(--ink);left:0;opacity:.6}
.meter2::after{content:"";position:absolute;left:calc(100% * 42 / 48);top:-3px;width:1px;height:8px;background:var(--rec);opacity:.5}
.dbread{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:64px;text-align:right}
.micrec.counting .dot{opacity:.4}
.recfield .empty{background:color-mix(in srgb,var(--bg) 35%,transparent)}
.recdecks{margin-top:14px}
.deck-head .hx{display:flex;align-items:center;gap:8px;margin-left:auto}
.deck-head h2{cursor:pointer;user-select:none;-webkit-user-select:none}
.fold{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0}
.fold:hover{color:var(--ink)}
.fold svg{width:11px;height:11px;transition:transform .25s ease}
.deck.closed .fold svg{transform:rotate(-90deg)}
.deck-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease,opacity .25s ease}
.deck-body>div{min-height:0;overflow:hidden}
.deck.closed .deck-body{grid-template-rows:0fr;opacity:0}
.deck.closed{padding-bottom:18px}
@media (prefers-reduced-motion:reduce){.deck-body,.fold svg{transition:none}}
.takes{margin-top:14px}
.takelist{display:flex;flex-direction:column;margin-top:10px}
.takerow{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.takerow:first-child{border-top:0}
.takerow canvas{width:100%;height:30px;display:block}
.takerow .meta{font-size:12.5px;white-space:nowrap;text-align:right}
.takerow .meta span{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;padding:0}
.pbtn svg{width:12px;height:12px}
.none{color:var(--muted);font-size:13px;padding:8px 0 2px;margin:0}
.decks{display:grid;gap:14px;margin-top:22px}
@media (min-width:900px){.decks{grid-template-columns:1.4fr 1fr;align-items:start}}
.deck{border-radius:22px;padding:18px 18px 20px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:16px;padding:3px;border-radius:999px;border:1px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 4px;font-weight:500;font-size:12.5px;cursor:pointer;text-align:center;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.tab .bar{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);flex-shrink:0}
.tab.off .bar{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}
.tab[aria-selected="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.deck-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;letter-spacing:-0.01em;line-height:1.1}
.toggle{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px 5px 9px;font-weight:500;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px}
.toggle i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--c)}
.toggle[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.toggle[aria-pressed="true"] i{background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.group{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.group h3{margin:0 0 6px;font-size:11.5px;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 22px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;padding-top:6px}
.ctl .name{color:var(--muted)}
.ctl .val{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;letter-spacing:.01em}
.ctl.full{grid-column:1/-1}
.ctl.dim{opacity:.35}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--track:var(--line);cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--thumb);border:0;margin-top:-6px;box-shadow:0 0 0 .5px var(--thumb-edge),0 1px 4px rgba(0,0,0,.25),0 0 0 6px color-mix(in srgb,var(--c) 0%,transparent);transition:box-shadow .15s}
input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 .5px var(--thumb-edge),0 1px 4px rgba(0,0,0,.25),0 0 0 7px color-mix(in srgb,var(--c) 18%,transparent)}
input[type=range]::-moz-range-track{height:1px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--thumb);border:0;box-shadow:0 0 0 .5px var(--thumb-edge),0 1px 4px rgba(0,0,0,.25)}
input[type=range]:focus-visible{outline:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;margin-top:6px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 4px;font-size:12.5px;font-weight:500;cursor:pointer;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
select{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ghead h3{margin:0 !important}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);padding:10px 18px;border-radius:999px;font-weight:500;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.deck-body{transition:none}.toast,#rec .dot,.micrec .dot,.round{transition:none}body::before{animation:none}}
@media (max-width:420px){.tab{font-size:12px;gap:5px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Driftfield</h1>
    </div>
    <div class="transport">
      <span class="rectime" id="recTime" aria-live="polite"></span>
      <button class="round" id="rec" aria-label="Record output" aria-pressed="false"><span class="dot"></span></button>
      <button class="round" id="play" aria-label="Play" disabled>
        <svg id="playIcon" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3.5v15l13-7.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <nav class="pages" role="tablist" aria-label="Page">
    <button type="button" role="tab" id="tabRecord" aria-selected="false">Record</button>
    <button type="button" role="tab" id="tabPerform" aria-selected="true">Perform</button>
  </nav>

  <div id="performPage">

  <section class="field" id="field">
    <canvas id="wave" aria-label="Waveform with four playback windows. Drag a window to move it, drag its edges to resize."></canvas>
    <div class="empty" id="empty">
      <p><strong>Start with a sound</strong></p>
      <div class="row">
        <button class="btn solid" id="loadEmpty">Load audio</button>
        <button class="btn" id="micEmpty">Record from mic</button>
        <button class="btn" id="genEmpty">Generate one</button>
      </div>
    </div>
  </section>

  <div class="row sources" id="sources" hidden></div>

  <div class="row toolbar" id="toolbar" hidden>
    <div class="row">
      <button class="btn" id="addAudio">Add audio</button>
      <button class="btn" id="scatter">Scatter windows</button>
    </div>
    <div class="row">
      <button class="btn quiet" id="savePreset">Save preset</button>
      <button class="btn quiet" id="loadPreset">Load preset</button>
    </div>
  </div>


  <div class="take" id="take">
    <div class="name" id="takeName"></div>
    <audio id="takeAudio" controls></audio>
    <div class="row">
      <button class="btn solid" id="takeSave">Save recording</button>
      <button class="btn" id="takeUse">Use as source</button>
      <button class="btn quiet" id="takeDiscard">Discard</button>
    </div>
  </div>

  <div class="decks">
    <section class="deck" id="winDeck" aria-label="Window settings"></section>
    <section class="deck" id="fxDeck" aria-label="Effects" style="--c:var(--muted)"></section>
  </div>
  </div>

  <div id="recordPage" hidden>
    <section class="field recfield">
      <canvas id="liveWave" aria-label="Live input waveform"></canvas>
      <div class="recbar">
        <button class="round micrec" id="micRec" aria-label="Start recording" aria-pressed="false" disabled><span class="dot"></span></button>
        <div class="recinfo">
          <div class="recstate"><span id="micState">Mic off</span><span class="rectime" id="micTime"></span></div>
          <div class="meter2"><i id="micLvl"></i><b id="micPeak"></b></div>
        </div>
        <span class="dbread" id="micDb"></span>
      </div>
      <div class="empty" id="micOff"><p><strong>Mic is off</strong></p><div class="row"><button class="btn solid" id="micEnable">Turn on mic</button></div></div>
    </section>
    <div class="decks recdecks">
      <section class="deck" id="inDeck" style="--c:var(--v1)"><h2>Input</h2></section>
      <section class="deck" id="charDeck" style="--c:var(--v1)"><h2>Character</h2></section>
    </div>
    <section class="deck takes" style="--c:var(--v1)"><h2>Takes</h2><div class="takelist" id="takeList"></div></section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="audio/*,.wav,.aif,.aiff,.mp3,.m4a,.flac,.ogg,.caf" multiple hidden>
<input type="file" id="presetIn" accept="application/json,.json" hidden>

<script>
/* ---------------- DSP engine (runs in an AudioWorklet, or on the main thread as a fallback) ---------------- */
class DFEngine {
  constructor(sr){
    this.sr=sr; this.src=[]; this.playing=false; this.master=0.8; this.pg=0;
    this.v=[];
    for(let i=0;i<4;i++) this.v.push({p:{on:false,src:0,start:0,len:0.1,oct:0,dir:0,xf:0.1,drift:0,drive:0,ftype:0,cut:1,res:0,level:0.8,pan:0,sendD:0,sendR:0},q:0,sign:1,off:0,lvl:0,pn:0,ic:[0,0,0,0],st:0,pos:0});
    this.fx={dTime:0.375,dFb:0.45,dTone:0.6,dPing:1,dLevel:0.6,rDecay:4,rDamp:0.5,rPre:0.02,rLevel:0.6,freeze:false};
    const ms=x=>Math.max(2,Math.round(x*sr/1000));
    this.dMax=Math.ceil(sr*2.1); this.dbL=new Float32Array(this.dMax); this.dbR=new Float32Array(this.dMax); this.dw=0; this.dts=0.375*sr; this.dlL=0; this.dlR=0;
    this.pMax=Math.ceil(sr*0.31); this.pbL=new Float32Array(this.pMax); this.pbR=new Float32Array(this.pMax); this.pw=0;
    this.ap=[4.77,3.59,12.73,9.3].map(x=>({b:new Float32Array(ms(x)),i:0}));

      urls.push('data:application/javascript;charset=utf-8,'+encodeURIComponent(WORKLET_SRC));

let mic=null, micN=0, page='perform', countT=null, preview=null;
const REC_DEF={gain:18,lowCut:0.35,highCut:0,comp:0.3,warmth:0,gate:0,proc:0,monitor:false,autoLevel:true,countIn:0};
const rec={...REC_DEF};
try{ const saved=JSON.parse(localStorage.getItem('driftfield-rec')||'null'); if(saved) Object.assign(rec,saved,{monitor:false}); }catch(e){}
const saveRec=()=>{ try{ localStorage.setItem('driftfield-rec',JSON.stringify(rec)); }catch(e){} };
const sclip=x=>{ const a=x<0?-x:x; if(a<=0.6) return x; const y=0.6+0.4*Math.tanh((a-0.6)/0.4); return x<0?-y:y; };
const setSession=t=>{ try{ if(navigator.audioSession) navigator.audioSession.type=t; }catch(e){} };
const lowCutHz=x=>x<0.01?0:20*Math.pow(20,x);
const highCutHz=x=>x<0.01?0:20000*Math.pow(0.1,x);
const gateDb=x=>x<0.01?null:-70+x*50;
const LIVE_N=640, LIVE_B=512;

function applyRec(){
  if(!mic) return; const n=mic.nodes, t=ac.currentTime, sr=ac.sampleRate;
  const lc=lowCutHz(rec.lowCut), hc=highCutHz(rec.highCut);
  n.hp.frequency.setTargetAtTime(lc||10,t,0.02);
  n.lp.frequency.setTargetAtTime(hc?Math.min(hc,sr*0.45):Math.min(22000,sr*0.45),t,0.02);
  n.gain.gain.setTargetAtTime(Math.pow(10,rec.gain/20),t,0.02);
  const a=rec.comp;
  n.comp.threshold.setTargetAtTime(-a*40,t,0.02); n.comp.ratio.setTargetAtTime(1+a*11,t,0.02);
  n.makeup.gain.setTargetAtTime(Math.pow(10,(a*14)/20),t,0.02);
  const k=1+rec.warmth*7, N=1024, c=new Float32Array(N), d=Math.tanh(k);
  for(let i=0;i<N;i++){ const x=i/(N-1)*2-1; c[i]=rec.warmth<0.01?x:(Math.tanh(k*x)/d)*(1-rec.warmth*0.15)+x*rec.warmth*0.15; }
  n.shape.curve=c;
  n.mon.gain.setTargetAtTime(rec.monitor?1:0,t,0.02);
  saveRec();
}
async function getStream(){
  const raw=rec.proc===0;
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!raw,noiseSuppression:!raw,autoGainControl:!raw}});
}
async function openMic(){
  if(mic) return true;
  const ready=ensureAudio();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("Microphone input isn't available here."); return false; }
  setSession('play-and-record');
  let stream;
  try{ stream=await getStream(); }
  catch(e){ setSession('playback'); toast(e&&e.name==='NotAllowedError'?'Microphone access was blocked. Allow it in your browser or app settings and try again.':'Could not open the microphone.'); return false; }
  if(!(await ready)){ stream.getTracks().forEach(t=>t.stop()); return false; }
  if(page!=='record'){ stream.getTracks().forEach(t=>t.stop()); setSession('playback'); return false; }
  ac.resume().catch(()=>{});
  const n={
    hp:new BiquadFilterNode(ac,{type:'highpass',Q:0.707}), lp:new BiquadFilterNode(ac,{type:'lowpass',Q:0.707}),
    gain:ac.createGain(), shape:new WaveShaperNode(ac,{oversample:'2x'}),
    comp:new DynamicsCompressorNode(ac,{knee:12,attack:0.005,release:0.2}), makeup:ac.createGain(),
    proc:ac.createScriptProcessor(2048,2,2), mon:ac.createGain()
  };
  n.src=ac.createMediaStreamSource(stream);
  n.src.connect(n.hp); n.hp.connect(n.lp); n.lp.connect(n.gain); n.gain.connect(n.shape); n.shape.connect(n.comp); n.comp.connect(n.makeup); n.makeup.connect(n.proc); n.proc.connect(n.mon); n.mon.connect(ac.destination);
  mic={stream,nodes:n,rec:false,l:[],r:[],len:0,peak:0,hold:0,holdT:0,genv:0,gg:1,
    live:new Float32Array(LIVE_N),liveRec:new Uint8Array(LIVE_N),lw:0,acc:0,accN:0};
  n.proc.onaudioprocess=e=>{
    if(!mic) return;
    const ib=e.inputBuffer, ob=e.outputBuffer, len=ib.length, sr=ac.sampleRate;
    const ra=ib.getChannelData(0), rb=ib.numberOfChannels>1?ib.getChannelData(1):ra;
    const oa=ob.getChannelData(0), obb=ob.numberOfChannels>1?ob.getChannelData(1):oa;
    const a=new Float32Array(len), b=rb===ra?a:new Float32Array(len);
    const thr=gateDb(rec.gate), tl=thr===null?0:Math.pow(10,thr/20);
    const ea=1-Math.exp(-1/(sr*0.002)), er=1-Math.exp(-1/(sr*0.15)), gA=1-Math.exp(-1/(sr*0.003)), gR=1-Math.exp(-1/(sr*0.12));
    let pk=0, env=mic.genv, gg=mic.gg;
    for(let i=0;i<len;i++){
      let x=ra[i], y=rb[i];
      if(thr!==null){ const m=Math.max(Math.abs(x),Math.abs(y)); env+=(m-env)*(m>env?ea:er); const tg=env>tl?1:0; gg+=(tg-gg)*(tg>gg?gA:gR); x*=gg; y*=gg; } else gg=1;
      x=sclip(x); y=sclip(y);
      a[i]=x; if(b!==a) b[i]=y; oa[i]=x; if(obb!==oa) obb[i]=y;
      const v=Math.abs(x); if(v>pk) pk=v;
      if(v>mic.acc) mic.acc=v;
      if(++mic.accN>=LIVE_B){ mic.live[mic.lw]=mic.acc; mic.liveRec[mic.lw]=mic.rec?1:0; mic.lw=(mic.lw+1)%LIVE_N; mic.acc=0; mic.accN=0; }
    }
    mic.genv=env; mic.gg=gg;
    mic.peak=Math.max(pk,mic.peak*0.8);
    if(pk>mic.hold){ mic.hold=pk; mic.holdT=performance.now(); }
    if(!mic.rec) return;

  };

  return true;
}
async function reopenStream(){
  if(!mic) return;
  if(mic.rec){ toast('Stop recording to change this.'); return; }
  let stream; try{ stream=await getStream(); }catch(e){ toast('Could not reopen the microphone.'); return; }
  if(!mic){ stream.getTracks().forEach(t=>t.stop()); return; }
  try{ mic.nodes.src.disconnect(); }catch(e){}
  mic.stream.getTracks().forEach(t=>t.stop());
  mic.stream=stream; mic.nodes.src=ac.createMediaStreamSource(stream); mic.nodes.src.connect(mic.nodes.hp);
}
function closeMic(){
  cancelCount();
  if(!mic) return;
  if(mic.rec) stopTake();
  const m=mic; mic=null;
  try{ m.nodes.src.disconnect(); m.nodes.proc.disconnect(); m.nodes.mon.disconnect(); }catch(e){}
  m.nodes.proc.onaudioprocess=null;
  m.stream.getTracks().forEach(t=>t.stop()); setSession('playback');
  updateMicUI();
}
function startTake(){
  if(!mic||mic.rec) return;
  mic.l=[]; mic.r=[]; mic.len=0; mic.rec=true; updateMicUI();
  if(state.playing&&!rec.monitor) toast('Use headphones to keep the speaker out of the take.');
}
function cancelCount(){ if(countT){ clearInterval(countT); countT=null; $('#micRec').classList.remove('counting'); updateMicUI(); } }
function armTake(){
  if(!mic) return;
  if(countT){ cancelCount(); return; }
  if(mic.rec){ stopTake(); return; }
  if(!rec.countIn){ startTake(); return; }
  let n=rec.countIn; $('#micRec').classList.add('counting'); $('#micState').textContent=`Starting in ${n}`;
  countT=setInterval(()=>{ n--; if(n<=0){ clearInterval(countT); countT=null; $('#micRec').classList.remove('counting'); startTake(); } else $('#micState').textContent=`Starting in ${n}`; },1000);
}
function stopTake(){
  if(!mic||!mic.rec) return;
  mic.rec=false; const len=mic.len, ls=mic.l, rs=mic.r; mic.l=[]; mic.r=[]; mic.len=0; updateMicUI();
  if(len<ac.sampleRate*0.25){ toast('That take was too short to keep.'); return; }
  const join=arr=>{ const out=new Float32Array(len); let o=0; for(const c of arr){ out.set(c,o); o+=c.length; } return out; };
  const L=join(ls), R=rs[0]===ls[0]?L:join(rs); let same=R===L;
  if(!same){ same=true; for(let i=0;i<len;i+=997){ if(L[i]!==R[i]){ same=false; break; } } }
  const ch=same?[L]:[L,R];
  if(rec.autoLevel) levelTake(ch,ac.sampleRate);
  // short fades so takes loop without clicks
  const f=Math.min(len>>2,Math.floor(ac.sampleRate*0.004)); for(const c of ch) for(let i=0;i<f;i++){ const g=i/f; c[i]*=g; c[len-1-i]*=g; }
  micN++; addSource(`Mic ${micN}`,ac.sampleRate,ch,'mic');
  toast(`Mic ${micN} saved. Window ${state.sel+1} now plays it.`);
}
function levelTake(chans,sr){
  const B=Math.max(64,Math.floor(sr*0.05)), n=chans[0].length, rms=[];
  for(let o=0;o+B<=n;o+=B){ let q=0; for(const c of chans) for(let i=o;i<o+B;i++) q+=c[i]*c[i]; rms.push(Math.sqrt(q/(B*chans.length))); }
  if(!rms.length) return;
  rms.sort((x,y)=>x-y); const ref=rms[Math.floor(rms.length*0.95)];

}
function updateMicUI(){

const lv=$('#liveWave'), lg=lv.getContext('2d'); let LW=0,LH=0;
new ResizeObserver(()=>{ const d=Math.min(2,window.devicePixelRatio||1); LW=lv.clientWidth; LH=lv.clientHeight; lv.width=Math.round(LW*d); lv.height=Math.round(LH*d); lg.setTransform(d,0,0,d,0,0); }).observe(lv);
function drawLive(){
  lg.clearRect(0,0,LW,LH);

  if(!mic) return;

async function playPreview(s){

  await ensureAudio();

  const node=ac.createBufferSource(); node.buffer=ab; const g=ac.createGain(); g.gain.value=s.gain*0.8;

  renderTakes();

function renderTakes(){

    x.innerHTML='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
    let armT=null;

      x.classList.add('armed'); x.textContent='Delete'; armT=setTimeout(()=>renderTakes(),3000); });

    requestAnimationFrame(()=>{ const d=Math.min(2,window.devicePixelRatio||1), w=cv2.clientWidth, h=cv2.clientHeight; if(!w) return;
      cv2.width=w*d; cv2.height=h*d; const c=cv2.getContext('2d'); c.scale(d,d); c.fillStyle=rgba(COL.wave,on?0.8:0.5);
      const pk=s.peaks.pk, B=pk.length, step=2;
      for(let px=0;px<w;px+=step){ const a=Math.floor(px/w*B), e=Math.max(a+1,Math.floor((px+step)/w*B)); let m=0; for(let k=a;k<e;k++) if(pk[k]>m) m=pk[k];

  let head=[...deck.children].find(el=>el.classList.contains('deck-head'));
  if(!head){ const h2=[...deck.children].find(el=>el.tagName==='H2'); if(!h2) return;
    head=document.createElement('div'); head.className='deck-head'; deck.insertBefore(head,h2); head.appendChild(h2); }
  const body=document.createElement('div'); body.className='deck-body'; body.id=deck.id?deck.id+'-body':'body-'+key;
  const inner=document.createElement('div'); body.appendChild(inner);
  let n=head.nextSibling; while(n){ const nx=n.nextSibling; inner.appendChild(n); n=nx; }
  deck.appendChild(body);
  const hx=document.createElement('div'); hx.className='hx';
  [...head.children].filter(el=>el.tagName!=='H2').forEach(el=>hx.appendChild(el));
  const btn=document.createElement('button'); btn.type='button'; btn.className='fold'; btn.setAttribute('aria-controls',body.id);
  btn.innerHTML='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  hx.appendChild(btn); head.appendChild(hx);
  const h2=head.querySelector('h2');
  const set=(closed,save)=>{ deck.classList.toggle('closed',closed); btn.setAttribute('aria-expanded',!closed);
    btn.setAttribute('aria-label',(closed?'Expand ':'Collapse ')+h2.textContent); body.inert=closed;
    if(save){ try{ localStorage.setItem('driftfield-fold-'+key,closed?'1':'0'); }catch(e){} } };
  let start=false; try{ start=localStorage.getItem('driftfield-fold-'+key)==='1'; }catch(e){}
  set(start,false);
  const toggle=()=>set(!deck.classList.contains('closed'),true);
  btn.addEventListener('click',toggle); h2.addEventListener('click',toggle);
}
foldable($('#winDeck'),'window'); foldable($('#fxDeck'),'effects');
foldable($('#inDeck'),'input'); foldable($('#charDeck'),'character'); foldable($('#takeList').closest('.deck'),'takes');
</script>
