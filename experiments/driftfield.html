<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Low Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&family=JetBrains+Mono:wght@400&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: a tool rail (left on desktop, bottom on phones) beside one quiet working surface per tool; the shared library sits under every tool. */
:root{
  --bg:#F2F3F4; --raise:#FFFFFF; --line:#E0E3E6; --line2:#D0D4D8; --rail:#C7CCD1;
  --ink:#14171A; --text:#2A2F34; --wave:#2A2F34; --dim:#575E65; --faint:#666D74; --ghost:#767D84;
  --field:#2F7D74; --stretch:#94652F; --tape:#A04B60; --rec:#B23B3B; --thumb:#FFFFFF; --thumb-edge:rgba(20,23,26,.28);
  --v1:#2F7D74; --v2:#2F7D74; --v3:#2F7D74; --v4:#2F7D74; --muted:#575E65;
  --f-ui:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-prov:"Newsreader", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121416; --raise:#181B1E; --line:#1F2326; --line2:#2A2F33; --rail:#2E3338;
    --ink:#E6E8EA; --text:#D5D8DB; --wave:#D5D8DB; --dim:#8A9097; --faint:#7E858C; --ghost:#6A7178;
    --field:#5FA89F; --stretch:#C29563; --tape:#C0798A; --rec:#D06060; --thumb:#E6E8EA; --thumb-edge:rgba(0,0,0,.5);
    --v1:#5FA89F; --v2:#5FA89F; --v3:#5FA89F; --v4:#5FA89F; --muted:#8A9097; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121416; --raise:#181B1E; --line:#1F2326; --line2:#2A2F33; --rail:#2E3338;
  --ink:#E6E8EA; --text:#D5D8DB; --wave:#D5D8DB; --dim:#8A9097; --faint:#7E858C; --ghost:#6A7178;
  --field:#5FA89F; --stretch:#C29563; --tape:#C0798A; --rec:#D06060; --thumb:#E6E8EA; --thumb-edge:rgba(0,0,0,.5);
  --v1:#5FA89F; --v2:#5FA89F; --v3:#5FA89F; --v4:#5FA89F; --muted:#8A9097; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-ui);font-size:14px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

/* shell */
.shell{display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 0;position:sticky;top:0;height:100vh}
.mark{display:block;margin-bottom:26px;color:var(--ink)}
.logo{display:block;width:30px;height:auto}
.mico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;color:var(--faint)}
.m-field .mico{color:var(--field)}.m-stretch .mico{color:var(--stretch)}.m-tape .mico{color:var(--tape)}
.rail a:not([aria-current="page"]) .mico{opacity:.7}
.rail a{width:64px;padding:12px 0;text-decoration:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;border-radius:10px}
.rail a[aria-current="page"]{color:var(--ink)}
.rail a[aria-current="page"]::after{content:"";width:18px;height:1px;background:var(--accent)}
.rail a:hover{color:var(--ink)}
.main{padding-block:28px 40px;padding-left:max(44px, env(safe-area-inset-left, 0px));padding-right:max(44px, env(safe-area-inset-right, 0px));min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:15;flex-direction:row;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom, 0px));padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));border-right:0;border-top:1px solid var(--line);background:var(--bg)}
  .mark{display:none}
  .rail a{flex:1;width:auto;padding:10px 0}
  .main{padding-block:18px 110px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));gap:18px}
}

/* accent: the current mode's color drives every highlight */
body{--accent:var(--stretch)}
body[data-view="tape"]{--accent:var(--tape)}
body[data-view="field"]{--accent:var(--field)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--text);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;position:relative;transition:border-color .15s,color .15s}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib:hover{border-color:var(--dim);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.ib.lg{width:50px;height:50px}.ib.lg svg{width:20px;height:20px}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:15px;height:15px}
.ib .n{font:400 11px var(--f-mono)}
.ib[aria-pressed="true"],.ib.on{border-color:var(--accent);color:var(--accent)}
.ib.to-field{border-color:color-mix(in srgb,var(--field) 70%,transparent);color:var(--field)}
.ib.to-stretch{border-color:color-mix(in srgb,var(--stretch) 70%,transparent);color:var(--stretch)}
.ib.to-tape{border-color:color-mix(in srgb,var(--tape) 70%,transparent);color:var(--tape)}
.ib.to-field:hover,.ib.to-stretch:hover,.ib.to-tape:hover{border-color:currentColor}
.ib.armed{border-color:var(--rec);color:var(--rec)}
.ib .dot{width:12px;height:12px;border-radius:50%;background:var(--rec);transition:border-radius .15s}
.ib.on .dot,.ib[aria-pressed="true"] .dot{border-radius:2px}
.ib.recb[aria-pressed="true"],.ib.recb.on{border-color:var(--rec)}
.glyph{display:inline-grid;place-items:center;width:20px;height:20px}
.glyph svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.glyph.to-tape{color:var(--tape)}
.ibcap{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.ibrow{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
label.ib input{display:none}
/* shared atoms */
.view{display:flex;flex-direction:column;gap:22px;min-width:0}
.vhead{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap}
.grow{flex:1}
.kdot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px var(--ghost)}
.k-field{background:var(--field);box-shadow:none}.k-stretch{background:var(--stretch);box-shadow:none}.k-tape{background:var(--tape);box-shadow:none}
.tag{font:400 10px var(--f-mono);letter-spacing:.16em;color:var(--ghost);text-transform:uppercase}
.prov{font-family:var(--f-prov);font-style:italic;font-size:14px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dur{font:400 11px var(--f-mono);color:var(--ghost);font-variant-numeric:tabular-nums;white-space:nowrap}
.wname{font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.faint{color:var(--faint);font-size:12px}
.pill,.btn{font:400 12.5px/1 var(--f-ui);color:var(--text);background:transparent;border:1px solid var(--line2);border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:34px}
.pill:hover,.btn:hover{border-color:var(--dim);color:var(--ink)}
.pill:disabled,.btn:disabled{opacity:.4;cursor:default}
.pill.strong,.btn.solid{border-color:var(--dim);color:var(--ink)}
.pill.danger{border-color:var(--rec);color:var(--rec)}
.btn.quiet{border-color:transparent;color:var(--faint)}
.num{font:400 11px var(--f-mono);width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;padding:0}
.num:hover{border-color:var(--dim)}
.num:disabled{opacity:.4;cursor:default}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink);flex:none}
.round.big{width:50px;height:50px;border-color:var(--dim)}
.round:disabled{opacity:.35;cursor:default}
.round svg{width:15px;height:15px}
.round .dot{width:12px;height:12px;border-radius:50%;background:var(--rec);transition:border-radius .15s}
.round.on,.round[aria-pressed="true"]{border-color:var(--rec)}
.round.on .dot,.round[aria-pressed="true"] .dot{border-radius:2px}
.counter{font-weight:300;font-size:34px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.counter.on{color:var(--rec)}
.status{font-size:12.5px;color:var(--faint);min-height:1.2em}
.status.warn{color:var(--rec)}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px;pointer-events:none;text-align:center}

/* range: one hairline style everywhere */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y;--c:var(--accent)}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--track, var(--rail))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--thumb);border:0;margin-top:-5px;box-shadow:0 0 0 .5px var(--thumb-edge),0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:1px;background:var(--track, var(--rail))}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--thumb);border:0;box-shadow:0 0 0 .5px var(--thumb-edge),0 1px 3px rgba(0,0,0,.25)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--ink)}
@media (pointer:coarse){input[type=range]{height:34px}input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-7.5px}}
select{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);width:100%}

/* control column (stretch, tape) */
.rack .ctl,.strip .ctl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rack .ctl label,.strip .ctl label{font-size:13px;color:var(--dim)}
.rack .ctl output,.strip .ctl output{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rack .ctl input[type=range],.strip .ctl input[type=range]{grid-column:1/-1}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* waveform blocks */
.wblock{display:flex;flex-direction:column;gap:10px;min-width:0}
.whead{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.whead .tag{width:64px}
.wavebox{position:relative;cursor:pointer;min-width:0}
.wavebox canvas{display:block;width:100%;height:100%}
.wavebox.sm{height:64px}.wavebox.lg{height:150px}.wavebox.tw{height:72px}
.rule{border-top:1px solid var(--line);padding-top:18px}
.sendto{display:inline-flex;align-items:center;gap:6px}
.whead .ib,.libact .ib{flex:none}

/* ---------- Field (Driftfield) ---------- */
.pages{display:flex;gap:22px;font-size:15px}
.pages button{border:0;background:transparent;padding:0 0 4px;color:var(--faint);cursor:pointer;border-bottom:1px solid transparent;font-size:15px}
.pages button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rectime{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--rec);min-width:0}
body[data-page="record"] #rec,body[data-page="record"] #recTime{display:none}
.field{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#wave{display:block;width:100%;height:240px;touch-action:none;cursor:grab}
@media (max-width:640px){#wave{height:220px}}
.field .empty{pointer-events:auto;display:flex;flex-direction:column;gap:18px}
.empty p{margin:0}
.empty strong{display:block;font-weight:300;font-size:26px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty .row{justify-content:center}
.sources{gap:6px 18px;font-size:13px}
.sources .lbl{color:var(--faint)}
.chipwrap{display:inline-flex;align-items:center}
.chip{border:0;background:transparent;padding:4px 0 3px;color:var(--faint);border-bottom:1px solid transparent;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.del{border:0;background:transparent;color:var(--ghost);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font-size:12px}
.del:hover{color:var(--ink)}
.del svg{width:8px;height:8px}
.del.armed{color:var(--rec);box-shadow:inset 0 0 0 1px var(--rec)}
.srcgain{flex-basis:100%;max-width:420px;margin-top:2px;--c:var(--accent)}
.toolbar{justify-content:space-between;gap:8px}
.take{border:1px solid var(--line2);border-radius:14px;padding:14px 16px;display:none;gap:12px;flex-direction:column}
.take.show{display:flex}
.take .name{color:var(--ink)}
.take audio{width:100%;height:36px}

.decks{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,2fr);gap:28px;border-top:1px solid var(--line);padding-top:18px}
.deck{min-width:0}
#winDeck{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 28px;align-content:start;--c:var(--accent)}
#winDeck>.tabs{grid-column:1/5}
#winDeck>.deck-head{grid-column:5/6;justify-self:end;align-self:center}
#winDeck h2{display:none}
#fxDeck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;align-content:start;padding-left:28px;border-left:1px solid var(--line);--c:var(--accent)}
#fxDeck>.deck-head,#fxDeck>.group:last-child{grid-column:1/-1}
.deck-head{display:flex;align-items:center;gap:10px}
.deck h2{font:400 10px var(--f-mono);letter-spacing:.16em;color:var(--ghost);text-transform:uppercase;margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:400 13px var(--f-ui);padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--faint);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab .bar{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.tab.off .bar{background:transparent;box-shadow:inset 0 0 0 1px var(--faint)}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--ink)}
.tab[aria-selected="true"] .bar{background:var(--accent)}
.toggle{font:400 12.5px var(--f-ui);padding:7px 13px 7px 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--faint);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.toggle i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--faint)}
.toggle[aria-pressed="true"]{color:var(--ink);border-color:var(--dim)}
.toggle[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.group{min-width:0}
.group h3,.ghead h3{margin:0 0 10px;font:400 10px var(--f-mono);letter-spacing:.16em;color:var(--ghost);text-transform:uppercase}
.ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ghead h3{margin:0}
.group .grid{display:flex;flex-direction:column;gap:10px}
#view-field .ctl{display:block}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.ctl .name{color:var(--dim)}
.ctl .val{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl.dim{opacity:.35}
.seg{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px}
.seg button{border:0;background:transparent;padding:2px 0 3px;color:var(--faint);font-size:12.5px;cursor:pointer;border-bottom:1px solid transparent}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:1180px){
  .decks{grid-template-columns:minmax(0,1fr)}
  #fxDeck{padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:18px}
  #winDeck{grid-template-columns:repeat(3,minmax(0,1fr))}
  #winDeck>.tabs{grid-column:1/-1}
  #winDeck>.deck-head{grid-column:1/-1;justify-self:start}
}
@media (max-width:640px){ #winDeck,#fxDeck{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px} }
@media (max-width:420px){ #winDeck,#fxDeck{grid-template-columns:minmax(0,1fr)} }

/* record page */
.recfield{display:flex;flex-direction:column;position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#liveWave{display:block;width:100%;height:220px}
.recbar{display:flex;align-items:center;gap:16px;padding:14px 0 16px;border-top:1px solid var(--line)}
.recinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.recstate{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text)}
.meter2{position:relative;height:1px;background:var(--rail)}
.meter2 i{position:absolute;left:0;top:-.5px;height:2px;width:0;background:var(--accent)}
.meter2 i.hot{background:var(--rec)}
.meter2 b{position:absolute;top:-3px;width:1px;height:7px;background:var(--ink);left:0;opacity:.6}
.dbread{font:400 12px var(--f-mono);color:var(--faint);min-width:64px;text-align:right}
.micrec{width:54px;height:54px}
.micrec .dot{width:15px;height:15px}
.micrec.counting .dot{opacity:.4}
.recfield .empty{background:color-mix(in srgb,var(--bg) 70%,transparent);pointer-events:auto;display:flex;flex-direction:column;gap:16px}
.recdecks{grid-template-columns:repeat(2,minmax(0,1fr))}
#inDeck,#charDeck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px;align-content:start;--c:var(--accent)}
#inDeck>h2,#charDeck>h2{grid-column:1/-1}
#charDeck{padding-left:28px;border-left:1px solid var(--line)}
.takes{border-top:1px solid var(--line);padding-top:18px;--c:var(--accent)}
.takelist{display:flex;flex-direction:column;margin-top:10px}
.takerow{display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.takerow:first-child{border-top:0}
.takerow canvas{width:100%;height:30px;display:block}
.takerow .meta{font-size:12.5px;white-space:nowrap;text-align:right;color:var(--text)}
.takerow .meta span{display:block;color:var(--faint);font-variant-numeric:tabular-nums}
.pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);color:var(--text);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.pbtn svg{width:11px;height:11px}
.none{color:var(--faint);font-size:13px;padding:8px 0 2px;margin:0}
@media (max-width:900px){ .recdecks{grid-template-columns:minmax(0,1fr)} #charDeck{padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:18px} }
@media (max-width:560px){ #inDeck,#charDeck{grid-template-columns:minmax(0,1fr)} }

/* ---------- Stretch ---------- */
.presetrow{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap}
.presets{display:flex;gap:10px 20px;flex-wrap:wrap}
.chip.preset{font-size:14px;padding:2px 0 3px;max-width:none}

.stretchcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 200px;gap:28px 40px;--c:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.notes{font:400 12px var(--f-mono);color:var(--faint);letter-spacing:.06em}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.go{justify-content:flex-end}
.go{align-items:center;justify-content:center;text-align:center}
.ib.xl{width:76px;height:76px;border-color:transparent;color:var(--accent)}
.ib.xl svg.ic{width:28px;height:28px}
.ib.xl .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);fill:none;stroke-width:1.5}
.ring .rt{stroke:color-mix(in srgb,var(--accent) 45%,transparent)}
.ring .rp{stroke:var(--accent);stroke-width:2;stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset .15s linear}
@media (max-width:1180px){ .stretchcols{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .stretchcols{grid-template-columns:minmax(0,1fr)} .whead .tag{width:auto} }
@media (prefers-reduced-motion:reduce){ .ring .rp{transition:none} }

.trimshade{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--bg) 74%,transparent);pointer-events:none}
.trim{position:absolute;top:-6px;bottom:-6px;width:28px;margin-left:-14px;cursor:ew-resize;touch-action:none;z-index:2;outline:none}
.trim::before{content:"";position:absolute;left:13.5px;top:0;bottom:0;width:1px;background:var(--accent)}
.trim::after{content:"";position:absolute;left:11px;top:50%;width:6px;height:24px;margin-top:-12px;border-radius:3px;background:var(--accent)}
.trim:focus-visible::after{box-shadow:0 0 0 2px var(--ink)}
.trim .tl{position:absolute;top:0;font:400 10px var(--f-mono);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.trim.ta .tl{left:20px}.trim.tb .tl{right:20px}
/* ---------- Tape ---------- */
.tctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.tctl input[type=range]{width:96px}
.tctl output{font:400 12px var(--f-mono);color:var(--faint);min-width:5ch;font-variant-numeric:tabular-nums}
.meter{width:64px;height:1px;background:var(--rail);display:block;position:relative}
.meter i{position:absolute;left:0;top:-.5px;height:2px;width:0;background:var(--accent)}
.strips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 56px}
@media (max-width:1080px){ .strips{grid-template-columns:minmax(0,1fr)} }
.strip{display:flex;flex-direction:column;gap:14px;padding:20px 0 24px;border-top:1px solid var(--line);min-width:0;--c:var(--accent)}
.strip.paused .wavebox{opacity:.45}
.shead{display:flex;align-items:center;gap:10px;min-width:0}
.snum{font:400 11px var(--f-mono);color:var(--faint)}
.sset{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px 40px;align-items:end}
@media (max-width:560px){ .sset{grid-template-columns:minmax(0,1fr)} }
.pitchread{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pitchread b{font-weight:400;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.iv{font-size:13px;color:var(--faint)}
.mseg{display:flex;gap:10px;margin-left:auto}
.mseg button{border:0;background:transparent;padding:2px 0 3px;font:400 11px var(--f-mono);color:var(--faint);cursor:pointer;border-bottom:1px solid transparent}
.mseg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ruler{position:relative;padding-bottom:16px}
.ticks{position:absolute;left:6px;right:6px;top:0;height:100%;pointer-events:none}
.ticks i{position:absolute;bottom:13px;width:1px;background:var(--rail)}
.ticks i.mj{background:var(--ghost)}
.ticks b{position:absolute;bottom:0;transform:translateX(-50%);font:400 9px var(--f-mono);color:var(--ghost);font-weight:400;white-space:nowrap}
.sbtns{display:flex;gap:8px;justify-content:flex-end}

.strip:not(.paused) .trun{border-color:var(--accent);color:var(--accent)}


@media (max-width:640px){
  #view-tape .vhead .grow{display:none}
  #view-tape .counter{flex:1}
  #view-tape .vhead .ib{order:1}
  #view-tape .tctl{order:2;flex:1 1 40%}
  #view-tape .tctl input[type=range]{width:auto;flex:1;min-width:0}
  #view-tape .meter{width:40px}
  #view-tape .status{order:3;flex-basis:100%}
}
body.libdrag .rail a,body.libdrag .strip,body.libdrag .wavebox,body.libdrag .field{outline:1px dashed var(--line2);outline-offset:2px}
.libitem{cursor:grab}
/* ---------- Library ---------- */
.lib{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.librow{display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap}
.libitems{display:flex;gap:6px 20px;flex-wrap:wrap;min-width:0}
.libitem{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 0 3px;color:var(--dim);font-size:13px;cursor:pointer;border-bottom:1px solid transparent;max-width:280px}
.libitem .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libitem[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.libact{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line2);border-radius:14px}
.libact .wname{font-size:15px}
@media (max-width:640px){ .libitems{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;max-width:100%} .libitem{flex:none} }

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,16px);background:var(--raise);border:1px solid var(--line2);padding:10px 18px;border-radius:999px;font-size:13px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){ .toast{bottom:calc(92px + env(safe-area-inset-bottom, 0px))} }
.dropveil{position:fixed;inset:0;pointer-events:none;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;z-index:40;font-weight:300;font-size:30px;color:var(--ink);border:1px dashed var(--dim)}
@media (prefers-reduced-motion:reduce){ .toast,.ib .dot{transition:none} }
</style>

/* Shared library: every tool adds to it and pulls from it. Items hold raw channel data. */
const Lib = (() => {
  let n = 0;
  return {
    items: [], sel: null, fns: [],
    add(it) { it.id = ++n; it.dur = it.chans[0].length / it.sr; this.items.push(it); this.emit(); return it; },
    get(id) { return this.items.find(x => x.id === id); },
    remove(id) { const i = this.items.findIndex(x => x.id === id); if (i >= 0) this.items.splice(i, 1); if (this.sel === id) this.sel = null; this.emit(); },
    select(id) { this.sel = this.sel === id ? null : id; this.emit(); },
    on(fn) { this.fns.push(fn); },
    emit() { for (const f of this.fns) { try { f(); } catch (e) { console.error(e); } } }
  };
})();
</script>

<script type="text/plain" id="workerSrc">
self.onmessage = (e) => {
  const { chans, N, stretch, outLen, mask, shimmer, seed } = e.data;
  const half = N >> 1, bits = Math.log2(N);
  const rev = new Uint32Array(N);
  for (let i = 0; i < N; i++) { let r = 0, x = i; for (let b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1; } rev[i] = r; }
  const cosT = new Float64Array(half), sinT = new Float64Array(half);
  for (let i = 0; i < half; i++) { cosT[i] = Math.cos(2 * Math.PI * i / N); sinT[i] = -Math.sin(2 * Math.PI * i / N); }
  function fft(re, im) {
    for (let i = 0; i < N; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let size = 2; size <= N; size <<= 1) {
      const h = size >> 1, step = N / size;
      for (let i = 0; i < N; i += size) {
        for (let j = 0, k = 0; j < h; j++, k += step) {
          const a = i + j, b = a + h;
          const tr = re[b] * cosT[k] - im[b] * sinT[k];
          const ti = re[b] * sinT[k] + im[b] * cosT[k];
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        }
      }
    }
  }
  let s = seed >>> 0;
  const rand = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const win = new Float64Array(N);
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);
  const hop = N >> 2, inHop = hop / stretch;
  const re = new Float64Array(N), im = new Float64Array(N), mag = new Float64Array(half + 1);
  const results = [];
  const framesPer = Math.ceil(outLen / hop), total = framesPer * chans.length;
  let done = 0, lastPost = 0;
  for (let c = 0; c < chans.length; c++) {
    const x = chans[c], L = x.length;
    const out = new Float32Array(outLen + N);
    let pos = 0;
    for (let o = 0; o < outLen; o += hop) {
      const i0 = Math.floor(pos) - half;
      for (let j = 0; j < N; j++) { const idx = i0 + j; re[j] = (idx >= 0 && idx < L ? x[idx] : 0) * win[j]; im[j] = 0; }
      fft(re, im);
      for (let k = 0; k <= half; k++) mag[k] = Math.sqrt(re[k] * re[k] + im[k] * im[k]);
      for (let k = 1; k < half; k++) {
        let v = mag[k];
        if (shimmer > 0) v += shimmer * mag[k >> 1];
        v *= mask[k];
        const ph = rand() * 6.283185307179586;
        re[k] = v * Math.cos(ph); im[k] = v * Math.sin(ph);
        re[N - k] = re[k]; im[N - k] = -im[k];
      }
      re[0] = 0; im[0] = 0; re[half] = 0; im[half] = 0;
      for (let i = 0; i < N; i++) im[i] = -im[i];
      fft(re, im);
      for (let j = 0; j < N; j++) out[o + j] += (re[j] / N) * win[j];
      pos += inHop;
      done++;
      if (done - lastPost > 24) { lastPost = done; self.postMessage({ progress: done / total }); }
    }
    results.push(out.subarray(0, outLen).slice());
  }
  self.postMessage({ done: true, chans: results }, results.map(r => r.buffer));
};

<script>
class TapeEngine {
  constructor(sr, post) {
    this.sr = sr; this.post = post;
    // two Hann grains (amplitude-complementary); each new grain is phase-aligned to the one fading out (WSOLA)
    this.G = Math.round(sr * 0.1); this.J = Math.round(sr * 0.013); this.W = Math.round(sr * 0.012);
    this.tracks = [];
    for (let i = 0; i < 4; i++) this.tracks.push(this.blank());
    this.playing = false; this.glide = 0.15; this.master = 0.7;
    this.clock = 0; this.rec = false; this.recL = null; this.recR = null; this.recN = 0; this.uiN = 0; this.peak = 0;
  }
  blank() {
    return { L: null, R: null, len: 0, pos: 0, pitch: 0, cur: 0, gain: 0.8, gcur: 0, mute: false, run: true, mx: 0, zq: false, zg: 1, g: [{ rp: 0, a: 0 }, { rp: 0, a: this.G >> 1 }] };
  }
  newGrain(t, g, other) {
    const L = t.L, R = t.R, len = t.len, J = this.J, W = this.W;
    const at = (x) => { let k = x % len; if (k < 0) k += len; k = k | 0; return L[k] + R[k]; };
    const b = other.rp;
    let best = -Infinity, bs = t.pos;
    for (let d = -J; d <= J; d += 2) {
      const s0 = t.pos + d; let c = 0, e = 1e-9;
      for (let j = 0; j < W; j += 4) { const v = at(s0 + j); c += v * at(b + j); e += v * v; }
      const sc = c / Math.sqrt(e);
      if (sc > best) { best = sc; bs = s0; }
    }
    g.rp = bs; g.a = 0;
  }
  resetGrains(t) { t.g[0].rp = t.pos; t.g[0].a = 0; t.g[1].rp = t.pos; t.g[1].a = this.G >> 1; }
  msg(m) {
    const t = this.tracks[m.track];
    switch (m.type) {
      case "load": t.L = m.L; t.R = m.R; t.len = m.L.length; t.pos = 0; t.cur = t.pitch; t.gcur = 0; t.mx = Math.abs(t.pitch) > 0.02 ? 1 : 0; this.resetGrains(t); break;
      case "unload": t.L = null; t.R = null; t.len = 0; break;
      case "set": t[m.key] = m.value; break;
      case "global": this[m.key] = m.value; break;
      case "zeroTrack": if (t.len) t.zq = true; break;
      case "play": this.playing = m.on; break;
      case "zero": this.clock = 0; for (const x of this.tracks) { x.pos = 0; if (x.len) this.resetGrains(x); } this.post({ type: "ui", clock: 0, pos: [0, 0, 0, 0], peak: 0 }); break;
      case "rec": if (m.on) { this.rec = true; this.newRec(); } else if (this.rec) { this.rec = false; this.flushRec(true); } break;
    }

  newRec() { this.recL = new Float32Array(16384); this.recR = new Float32Array(16384); this.recN = 0; }
  flushRec(final) {
    if (this.recL) { const L = this.recL.slice(0, this.recN), R = this.recR.slice(0, this.recN); this.post({ type: "rec", L, R, final }, [L.buffer, R.buffer]); }

  process(oL, oR, n) {
    if (!this.playing) { oL.fill(0); if (oR !== oL) oR.fill(0); return; }
    const sr = this.sr, G = this.G;
    const kp = 1 - Math.exp(-1 / (Math.max(0.003, this.glide) * sr));
    const kg = 1 - Math.exp(-1 / (0.03 * sr)), kx = 1 - Math.exp(-1 / (0.02 * sr)), kz = 1 - Math.exp(-1 / (0.004 * sr));

function makeField(sr){
  const dur=24, n=Math.floor(sr*dur), L=new Float32Array(n), R=new Float32Array(n), TP=Math.PI*2;
  let bl=0,br=0;
  for(let i=0;i<n;i++){
    const t=i/sr, sw=0.35+0.25*Math.sin(TP*t/9.3)+0.2*Math.sin(TP*t/3.7+1.3);
    bl=(bl+0.02*(Math.random()*2-1))/1.02; br=(br+0.02*(Math.random()*2-1))/1.02;
    const dr=(0.6+0.4*Math.sin(TP*t/11));
    const d=0.05*Math.sin(TP*110*t)*dr+0.035*Math.sin(TP*164.8*t+0.7)*(1-dr*0.5)+0.022*Math.sin(TP*220.6*t);
    L[i]+=bl*sw*2.2+d; R[i]+=br*sw*2.2+d*0.92;
  }
  const add=(t0,len,fn,pan,amp)=>{ const a=Math.floor(t0*sr), m=Math.min(n-a,Math.floor(len*sr)); const gl=Math.cos((pan+1)*Math.PI/4), gr=Math.sin((pan+1)*Math.PI/4);
    for(let j=0;j<m;j++){ const y=fn(j/sr,j/m)*amp; L[a+j]+=y*gl; R[a+j]+=y*gr; } };
  for(let k=0;k<22;k++){
    const t0=Math.random()*(dur-1.5), f0=2200+Math.random()*2200, f1=f0*(0.7+Math.random()*0.8), reps=1+Math.floor(Math.random()*3), pan=Math.random()*1.6-0.8;
    for(let r=0;r<reps;r++){ const len=0.06+Math.random()*0.16; let ph=0;
      add(t0+r*(len+0.08),len,(t,u)=>{ const f=f0+(f1-f0)*u; ph+=TP*f/sr; const e=Math.pow(Math.sin(Math.PI*u),2); return e*(Math.sin(ph)+0.3*Math.sin(2*ph)); },pan,0.1+Math.random()*0.1); }
  }
  const notes=[261.6,293.7,329.6,392,440,523.3,587.3];
  for(let k=0;k<8;k++){ const f=notes[Math.floor(Math.random()*notes.length)]*(Math.random()<0.3?0.5:1);
    add(1+Math.random()*(dur-5),4,(t)=>{ const e=Math.exp(-t*1.4)*Math.min(1,t*400); return e*(Math.sin(TP*f*t)+0.5*Math.sin(TP*f*2.76*t)*Math.exp(-t*2)+0.25*Math.sin(TP*f*5.4*t)*Math.exp(-t*4)+0.12*Math.sin(TP*f*8.93*t)*Math.exp(-t*6)); },Math.random()*1.4-0.7,0.11); }
  for(let k=0;k<34;k++){ const f=900+Math.random()*1500;
    add(Math.random()*(dur-0.2),0.08,(t)=>Math.exp(-t*70)*Math.sin(TP*f*t*(1-t*2)),Math.random()*2-1,0.18); }
  let pk=0; for(let i=0;i<n;i++){ pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i])); }
  const g=0.85/(pk||1); for(let i=0;i<n;i++){L[i]*=g;R[i]*=g;}
  return [L,R];
}

const cv=$('#wave'), g2=cv.getContext('2d');

function buildWave(){

    g2.font='400 10px "JetBrains Mono", ui-monospace, monospace'; g2.fillStyle=c; g2.beginPath(); g2.arc(11,y+12,2.5,0,Math.PI*2); if(v.on) g2.fill(); else { g2.strokeStyle=c; g2.lineWidth=1; g2.stroke(); } g2.fillStyle=c; g2.fillText('0'+(i+1),19,y+15.5);

    const st=state.playing?report.st[i]:v.start, x0=st*W, w=Math.max(2,v.len*W);

      g2.setLineDash(v.on?[]:[3,3]); g2.strokeStyle=rgba(c,i===state.sel?0.95:0.55); g2.lineWidth=1;
      g2.beginPath(); g2.roundRect?g2.roundRect(sx+0.5,top+0.5,sw-1,hh-1,Math.min(6,sw/2)):g2.rect(sx+0.5,top+0.5,sw-1,hh-1); g2.stroke();

  }
}

let mic=null, micN=0, page='perform', countT=null, preview=null;
const REC_DEF={gain:18,lowCut:0.35,highCut:0,comp:0.3,warmth:0,gate:0,proc:0,monitor:false,autoLevel:true,countIn:0};
const rec={...REC_DEF};
try{ const saved=JSON.parse(localStorage.getItem('driftfield-rec')||'null'); if(saved) Object.assign(rec,saved,{monitor:false}); }catch(e){}
const saveRec=()=>{ try{ localStorage.setItem('driftfield-rec',JSON.stringify(rec)); }catch(e){} };
const sclip=x=>{ const a=x<0?-x:x; if(a<=0.6) return x; const y=0.6+0.4*Math.tanh((a-0.6)/0.4); return x<0?-y:y; };

const lowCutHz=x=>x<0.01?0:20*Math.pow(20,x);
const highCutHz=x=>x<0.01?0:20000*Math.pow(0.1,x);
const gateDb=x=>x<0.01?null:-70+x*50;
const LIVE_N=640, LIVE_B=512;

function applyRec(){
  if(!mic) return; const n=mic.nodes, t=ac.currentTime, sr=ac.sampleRate;
  const lc=lowCutHz(rec.lowCut), hc=highCutHz(rec.highCut);
  n.hp.frequency.setTargetAtTime(lc||10,t,0.02);
  n.lp.frequency.setTargetAtTime(hc?Math.min(hc,sr*0.45):Math.min(22000,sr*0.45),t,0.02);
  n.gain.gain.setTargetAtTime(Math.pow(10,rec.gain/20),t,0.02);
  const a=rec.comp;
  n.comp.threshold.setTargetAtTime(-a*40,t,0.02); n.comp.ratio.setTargetAtTime(1+a*11,t,0.02);
  n.makeup.gain.setTargetAtTime(Math.pow(10,(a*14)/20),t,0.02);
  const k=1+rec.warmth*7, N=1024, c=new Float32Array(N), d=Math.tanh(k);
  for(let i=0;i<N;i++){ const x=i/(N-1)*2-1; c[i]=rec.warmth<0.01?x:(Math.tanh(k*x)/d)*(1-rec.warmth*0.15)+x*rec.warmth*0.15; }

  n.mon.gain.setTargetAtTime(rec.monitor?1:0,t,0.02);
  saveRec();
}
async function getStream(){
  const raw=rec.proc===0;
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:!raw,noiseSuppression:!raw,autoGainControl:!raw}});
}
async function openMic(){
  if(mic) return true;
  const ready=ensureAudio();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("Microphone input isn't available here."); return false; }
  setSession('play-and-record');
  let stream;
  try{ stream=await getStream(); }
  catch(e){ setSession('playback'); toast(e&&e.name==='NotAllowedError'?'Microphone access was blocked. Allow it in your browser or app settings and try again.':'Could not open the microphone.'); return false; }
  if(!(await ready)){ stream.getTracks().forEach(t=>t.stop()); return false; }
  if(page!=='record'){ stream.getTracks().forEach(t=>t.stop()); setSession('playback'); return false; }
  ac.resume().catch(()=>{});
  const n={
    hp:new BiquadFilterNode(ac,{type:'highpass',Q:0.707}), lp:new BiquadFilterNode(ac,{type:'lowpass',Q:0.707}),
    gain:ac.createGain(), shape:new WaveShaperNode(ac,{oversample:'2x'}),
    comp:new DynamicsCompressorNode(ac,{knee:12,attack:0.005,release:0.2}), makeup:ac.createGain(),
    proc:ac.createScriptProcessor(2048,2,2), mon:ac.createGain()

  n.src.connect(n.hp); n.hp.connect(n.lp); n.lp.connect(n.gain); n.gain.connect(n.shape); n.shape.connect(n.comp); n.comp.connect(n.makeup); n.makeup.connect(n.proc); n.proc.connect(n.mon); n.mon.connect(ac.destination);

    live:new Float32Array(LIVE_N),liveRec:new Uint8Array(LIVE_N),lw:0,acc:0,accN:0};
  n.proc.onaudioprocess=e=>{
    if(!mic) return;

    const ra=ib.getChannelData(0), rb=ib.numberOfChannels>1?ib.getChannelData(1):ra;
    const oa=ob.getChannelData(0), obb=ob.numberOfChannels>1?ob.getChannelData(1):oa;

}
async function reopenStream(){
  if(!mic) return;

  let stream; try{ stream=await getStream(); }catch(e){ toast('Could not reopen the microphone.'); return; }
  if(!mic){ stream.getTracks().forEach(t=>t.stop()); return; }

  mic.stream.getTracks().forEach(t=>t.stop());

}
function closeMic(){
  cancelCount();
  if(!mic) return;
  if(mic.rec) stopTake();
  const m=mic; mic=null;
  try{ m.nodes.src.disconnect(); m.nodes.proc.disconnect(); m.nodes.mon.disconnect(); }catch(e){}
  m.nodes.proc.onaudioprocess=null;
  m.stream.getTracks().forEach(t=>t.stop()); setSession('playback');
  updateMicUI();
}
function startTake(){
  if(!mic||mic.rec) return;
  mic.l=[]; mic.r=[]; mic.len=0; mic.rec=true; updateMicUI();
  if(state.playing&&!rec.monitor) toast('Use headphones to keep the speaker out of the take.');
}
function cancelCount(){ if(countT){ clearInterval(countT); countT=null; $('#micRec').classList.remove('counting'); updateMicUI(); } }
function armTake(){
  if(!mic) return;
  if(countT){ cancelCount(); return; }
  if(mic.rec){ stopTake(); return; }
  if(!rec.countIn){ startTake(); return; }
  let n=rec.countIn; $('#micRec').classList.add('counting'); $('#micState').textContent=`Starting in ${n}`;
  countT=setInterval(()=>{ n--; if(n<=0){ clearInterval(countT); countT=null; $('#micRec').classList.remove('counting'); startTake(); } else $('#micState').textContent=`Starting in ${n}`; },1000);
}
function stopTake(){
  if(!mic||!mic.rec) return;
  mic.rec=false; const len=mic.len, ls=mic.l, rs=mic.r; mic.l=[]; mic.r=[]; mic.len=0; updateMicUI();
  if(len<ac.sampleRate*0.25){ toast('That take was too short to keep.'); return; }
  const join=arr=>{ const out=new Float32Array(len); let o=0; for(const c of arr){ out.set(c,o); o+=c.length; } return out; };
  const L=join(ls), R=rs[0]===ls[0]?L:join(rs); let same=R===L;
  if(!same){ same=true; for(let i=0;i<len;i+=997){ if(L[i]!==R[i]){ same=false; break; } } }
  const ch=same?[L]:[L,R];
  if(rec.autoLevel) levelTake(ch,ac.sampleRate);

  const f=Math.min(len>>2,Math.floor(ac.sampleRate*0.004)); for(const c of ch) for(let i=0;i<f;i++){ const g=i/f; c[i]*=g; c[len-1-i]*=g; }

  toast(`Mic ${micN} saved. Window ${state.sel+1} now plays it.`);
}
function levelTake(chans,sr){
  const B=Math.max(64,Math.floor(sr*0.05)), n=chans[0].length, rms=[];
  for(let o=0;o+B<=n;o+=B){ let q=0; for(const c of chans) for(let i=o;i<o+B;i++) q+=c[i]*c[i]; rms.push(Math.sqrt(q/(B*chans.length))); }

function updateMicUI(){
  const on=!!(mic&&mic.rec), b=$('#micRec');

/* live view */
const lv=$('#liveWave'), lg=lv.getContext('2d'); let LW=0,LH=0;
new ResizeObserver(()=>{ const d=Math.min(2,window.devicePixelRatio||1); LW=lv.clientWidth; LH=lv.clientHeight; lv.width=Math.round(LW*d); lv.height=Math.round(LH*d); lg.setTransform(d,0,0,d,0,0); }).observe(lv);
function drawLive(){

const PLAY_I='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>';

function foldable(deck,key){
  let head=[...deck.children].find(el=>el.classList.contains('deck-head'));
  if(!head){ const h2=[...deck.children].find(el=>el.tagName==='H2'); if(!h2) return;
    head=document.createElement('div'); head.className='deck-head'; deck.insertBefore(head,h2); head.appendChild(h2); }

  const inner=document.createElement('div'); body.appendChild(inner);
  let n=head.nextSibling; while(n){ const nx=n.nextSibling; inner.appendChild(n); n=nx; }
  deck.appendChild(body);

  [...head.children].filter(el=>el.tagName!=='H2').forEach(el=>hx.appendChild(el));

  hx.appendChild(btn); head.appendChild(hx);
  const h2=head.querySelector('h2');
  const set=(closed,save)=>{ deck.classList.toggle('closed',closed); btn.setAttribute('aria-expanded',!closed);
    btn.setAttribute('aria-label',(closed?'Expand ':'Collapse ')+h2.textContent); body.inert=closed;
    if(save){ try{ localStorage.setItem('driftfield-fold-'+key,closed?'1':'0'); }catch(e){} } };
  let start=false; try{ start=localStorage.getItem('driftfield-fold-'+key)==='1'; }catch(e){}
  set(start,false);

  btn.addEventListener('click',toggle); h2.addEventListener('click',toggle);
}

            <div class="ticks" aria-hidden="true">${ticksHTML}</div>
            <input id="tp${i}" type="range" min="-24" max="24" step="1" value="0" data-bipolar="1" aria-label="Track ${i + 1} pitch">
          </div>
        </div>
        <div class="col" style="gap:10px">
          <div class="ctl"><label for="tg${i}">Level</label><output id="tgo${i}">80</output><input id="tg${i}" type="range" min="0" max="100" step="1" value="80"></div>
          <div class="sbtns"><button type="button" class="ib trun" id="tr${i}"></button><button type="button" class="ib" id="tz${i}" aria-label="Return track ${i + 1} to the start" title="Zero">${IC.zero}</button><button type="button" class="ib" id="tm${i}" aria-label="Mute track ${i + 1}" title="Mute">${IC.mute}</button><button type="button" class="ib" id="tc${i}" aria-label="Clear track ${i + 1}" title="Clear">${IC.clear}</button></div>
        </div>
      </div>`;
    $("strips").appendChild(d);
    $("tf" + i).addEventListener("change", (e) => { if (e.target.files[0]) loadTrackFile(i, e.target.files[0]); e.target.value = ""; });
    $("tp" + i).addEventListener("input", (e) => { t.pitch = t.stepped ? Math.round(+e.target.value) : +e.target.value; syncStrip(i); pushTrack(i); });
    $("tp" + i).addEventListener("dblclick", () => { t.pitch = 0; syncStrip(i); pushTrack(i); });
    $("tst" + i).addEventListener("click", () => { t.stepped = true; t.pitch = Math.round(t.pitch); syncStrip(i); pushTrack(i); });
    $("tfr" + i).addEventListener("click", () => { t.stepped = false; syncStrip(i); });
    $("tg" + i).addEventListener("input", (e) => { t.gain = +e.target.value / 100; syncStrip(i); pushTrack(i); });
    $("tm" + i).addEventListener("click", () => { t.mute = !t.mute; syncStrip(i); pushTrack(i); });
    $("tr" + i).addEventListener("click", () => setTrackRun(i, !t.run));
    $("tz" + i).addEventListener("click", async () => { if (!t.buf) return; await ensureTape(); tape.send({ type: "zeroTrack", track: i }); });
    $("tc" + i).addEventListener("click", () => clearTrack(i));
    $("t" + i + "Box").addEventListener("click", () => { if (!t.buf) $("tf" + i).click(); });
    syncStrip(i);
  });

  async function toField(it) { await ensureAudio(); addSource(it.name, it.sr, it.chans.map(c => c.slice()), "lib", { fromLib: true }); location.hash = "#field"; toast(it.name + " added to Field."); }
  function toStretch(it) { setSource(bufFromItem(it), it.name, it); location.hash = "#stretch"; setStatus("New source. Press Render."); }
  $("bField").addEventListener("click", () => bounce && toField(bounce.item));
  $("bStretch").addEventListener("click", () => bounce && toStretch(bounce.item));
  $("outField").addEventListener("click", () => { const it = keepOut(); if (it) toField(it); });
  $("bExport").addEventListener("click", () => bounce && exportBuffer(bounce.buf, safeName("lowlight_" + bounce.name), tSay));
  document.querySelectorAll("[data-send]").forEach(b => b.addEventListener("click", async () => {
    const i = +b.dataset.to, which = b.dataset.send;
    if (which === "out" && out) { const it = keepOut(); await loadTrack(i, trimmed(), it.name, "stretch", it.prov); setStatus("Sent to tape track " + (i + 1) + "."); tSay("Track " + (i + 1) + " loaded from Stretch."); }
    if (which === "bounce" && bounce) { await loadTrack(i, bounce.buf, bounce.name, "tape", bounce.prov); tSay(bounce.name + " loaded onto track " + (i + 1) + "."); }
  }));

  let traf = 0;
  function fmtCounter(sec) { const m = Math.floor(sec / 60), s = sec - m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); }
  function drawTapeUI() {
    if (view !== "tape") return;
    $("counter").textContent = fmtCounter(ac && recording ? Math.max(0, ui.clock - recStart) / ac.sampleRate : 0);
    $("meter").style.width = Math.min(100, ui.peak * 100) + "%";
    for (let i = 0; i < 4; i++) if (T[i].buf) drawWave("t" + i, ui.pos[i], tapePlaying, COLS.tape);
  }
  function tapeTick() { cancelAnimationFrame(traf); drawTapeUI(); if (tapePlaying || recording) traf = requestAnimationFrame(tapeTick); }

  async function loadDemoTape() {
    if (demoLoaded || !out || T.some(t => t.buf)) return;
    demoLoaded = true;
    const it = keepOut();
    T[0].gain = 0.8; T[1].pitch = 7; T[1].gain = 0.5; T[2].pitch = -12; T[2].gain = 0.45;
    for (let i = 0; i < 3; i++) await loadTrack(i, trimmed(), it.name, "stretch", it.prov);
    for (let i = 0; i < 3; i++) pushTrack(i);
    tSay("Example setup: your render on 1, a 5th up on 2, an octave down on 3. Press play on each track.");
  }

  // ---------- library ----------
  function renderLib() {
    const box = $("libItems"); box.innerHTML = "";
    if (!Lib.items.length) { const s = document.createElement("span"); s.className = "faint"; s.textContent = "Recordings, renders and bounces collect here."; box.appendChild(s); }
    for (const it of Lib.items) {
      const b = document.createElement("button"); b.type = "button"; b.className = "libitem"; b.draggable = true;
      b.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/x-driftfield-lib", String(it.id)); e.dataTransfer.effectAllowed = "copy"; document.body.classList.add("libdrag"); });
      b.setAttribute("aria-pressed", Lib.sel === it.id ? "true" : "false"); b.title = it.prov;
      b.innerHTML = `<span class="kdot k-${it.kind}"></span><span class="ln"></span><span class="dur">${fmt(it.dur)}</span>`;
      b.querySelector(".ln").textContent = it.name;
      b.addEventListener("click", () => Lib.select(it.id));
      box.appendChild(b);
    }
    const it = Lib.get(Lib.sel);
    $("libAct").hidden = !it;
    if (it) {
      $("laDot").className = "kdot k-" + it.kind; $("laName").textContent = it.name; $("laProv").textContent = it.prov; $("laDur").textContent = fmt(it.dur);
      disarmDel(); syncButtons();
    }
  }
  Lib.on(renderLib);
  const selItem = () => Lib.get(Lib.sel);
  $("laPlay").addEventListener("click", () => {
    const it = selItem(); if (!it) return;
    if (player.which === "lib" && libPlayId === it.id) { stopAll(); return; }
    libBuf = bufFromItem(it); libPlayId = it.id; play("lib", libBuf, 0);
  });
  $("laField").addEventListener("click", async () => {
    const it = selItem(); if (!it) return;
    await ensureAudio();
    addSource(it.name, it.sr, it.chans.map(c => c.slice()), "lib", { fromLib: true });
    location.hash = "#field"; toast(it.name + " added to Field.");
  });
  $("laStretch").addEventListener("click", () => {
    const it = selItem(); if (!it) return;
    setSource(bufFromItem(it), it.name, it); location.hash = "#stretch"; setStatus("New source. Press Render.");
  });
  document.querySelectorAll("[data-lib-to]").forEach(b => b.addEventListener("click", async () => {
    const it = selItem(); if (!it) return; const i = +b.dataset.libTo;
    await loadTrack(i, bufFromItem(it), it.name, it.kind, it.prov); location.hash = "#tape"; tSay(it.name + " loaded onto track " + (i + 1) + ".");
  }));
  $("laExport").addEventListener("click", () => { const it = selItem(); if (it) exportBuffer(bufFromItem(it), safeName("lowlight_" + it.name), (t) => toast(t)); });
  let delT = null;
  function disarmDel() { clearTimeout(delT); $("laDel").classList.remove("armed"); $("laDel").title = "Delete from the library"; $("laDel").setAttribute("aria-label", "Delete from the library"); }
  $("laDel").addEventListener("click", () => {
    const it = selItem(); if (!it) return;
    if ($("laDel").classList.contains("armed")) {
      disarmDel();
      if (libPlayId === it.id && player.which === "lib") stopAll();
      if (srcItem === it) srcItem = null;
      Lib.remove(it.id); toast(it.name + " removed from the library.");
      return;
    }
    $("laDel").classList.add("armed"); $("laDel").title = "Tap again to delete"; $("laDel").setAttribute("aria-label", "Tap again to delete");
    delT = setTimeout(disarmDel, 3000);
  });

  // ---------- drag and drop: files or library items onto any mode ----------
  const MODES = ["stretch", "tape", "field"];
  async function dropTo(mode, trackIdx, item, files) {
    if (location.hash !== "#" + mode) location.hash = "#" + mode;
    if (mode === "stretch") {
      if (item) { setSource(bufFromItem(item), item.name, item); setStatus("New source. Press Render."); }
      else if (files.length) loadFile(files[0]);
    } else if (mode === "tape") {
      const i = trackIdx >= 0 ? trackIdx : Math.max(0, T.findIndex(t => !t.buf));
      if (item) { await loadTrack(i, bufFromItem(item), item.name, item.kind, item.prov); tSay(item.name + " loaded onto track " + (i + 1) + "."); }
      else if (files.length) loadTrackFile(i, files[0]);
    } else {
      if (item) { await ensureAudio(); addSource(item.name, item.sr, item.chans.map(c => c.slice()), "lib", { fromLib: true }); toast(item.name + " added to Field."); }
      else if (files.length) loadFiles(files);
    }
  }
  let dragDepth = 0;
  const isFiles = (e) => [...e.dataTransfer.types].includes("Files");
  const isLib = (e) => [...e.dataTransfer.types].includes("text/x-driftfield-lib");
  document.addEventListener("dragenter", (e) => { if (isFiles(e)) { dragDepth++; $("veil").hidden = false; } });
  document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("veil").hidden = true; });
  document.addEventListener("dragover", (e) => { if (isFiles(e) || isLib(e)) e.preventDefault(); });
  document.addEventListener("dragend", () => document.body.classList.remove("libdrag"));
  document.addEventListener("drop", (e) => {
    e.preventDefault(); dragDepth = 0; $("veil").hidden = true; document.body.classList.remove("libdrag");
    const files = [...e.dataTransfer.files], id = +e.dataTransfer.getData("text/x-driftfield-lib"), item = id ? Lib.get(id) : null;
    if (!files.length && !item) return;
    const tab = e.target.closest && e.target.closest(".rail a");
    const mode = tab ? tab.id.replace("tab-", "") : view;
    const strip = !tab && e.target.closest && e.target.closest("[data-track]");
    dropTo(mode, strip ? +strip.dataset.track : -1, item, files);
  });

  // ---------- views ----------
  const VIEWS = ["stretch", "tape", "field"];
  function showView() {
    const h = location.hash.slice(1);
    view = VIEWS.includes(h) ? h : "stretch";
    for (const v of VIEWS) { $("view-" + v).hidden = v !== view; $("tab-" + v).setAttribute("aria-current", v === view ? "page" : "false"); }
    document.body.dataset.view = view;
    if (view !== "field" && typeof page !== "undefined" && page === "record") setPage("perform");
    requestAnimationFrame(() => { draw(); drawTapeUI(); paintRanges(); });
    if (view === "tape") loadDemoTape();
  }
  window.addEventListener("hashchange", showView);
  new ResizeObserver(() => draw()).observe(document.querySelector(".main"));
  document.addEventListener("keydown", (e) => {
    if (e.code !== "Space" || view === "field") return;
    const tg = e.target.tagName; if (["INPUT", "SELECT", "BUTTON", "TEXTAREA"].includes(tg)) return;
    e.preventDefault();
    if (view === "tape") { const on = !tapePlaying; T.forEach((t, i) => { if (t.buf) setTrackRun(i, on); }); }
    else if (out) { if (player.which === "out") stopAll(); else playOut(trim.a); }
  });

  // ---------- boot ----------
  const demo = demoBuffer();
  const demoItem = Lib.add({ name: "Demo chord", kind: "field", prov: "a synthesized chord", sr: demo.sampleRate, chans: chansFromBuf(demo) });
  setSource(demo, "Demo chord", demoItem);
  applyDefaults();
  readTransport(); syncTransport(); renderLib();
  showView();
  setTimeout(render, 80);
})();
</script>

</body>
</html>
